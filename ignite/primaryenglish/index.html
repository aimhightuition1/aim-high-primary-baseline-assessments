<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aim High Tuition — Ignite English Baseline</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --brand:      #1a3a5c;
    --brand-dark: #0f2440;
    --gold:       #1d6fc4;
    --gold-light: #eef5ff;
    --gold-mid:   #bfdbfe;
    --green:      #1B5E20;
    --green-light:#E8F5E9;
    --amber:      #E65100;
    --amber-light:#FFF3E0;
    --red-c:      #B71C1C;
    --red-light:  #FFEBEE;
    --grey-light: #F5F5F5;
    --grey-mid:   #E0E0E0;
    --text:       #1A1A1A;
    --text-soft:  #555;
    --white:      #FFFFFF;
    --radius:     12px;
    --shadow:     0 4px 20px rgba(0,0,0,0.10);
  }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--gold-light);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── HEADER ── */
  header {
    width: 100%;
    background: var(--brand);
    color: white;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-star { font-size: 28px; }
  .logo-text { font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
  .logo-sub  { font-size: 11px; opacity: 0.8; }

  /* ── MAIN CARD ── */
  .card {
    background: white;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 32px 28px;
    width: 100%;
    max-width: 640px;
    margin: 24px 16px;
  }

  /* ── PROGRESS BAR ── */
  .progress-wrap {
    background: var(--grey-mid);
    border-radius: 99px;
    height: 10px;
    margin-bottom: 6px;
    overflow: hidden;
  }
  .progress-bar {
    background: linear-gradient(90deg, var(--brand), var(--gold));
    height: 100%;
    border-radius: 99px;
    transition: width 0.4s ease;
  }
  .progress-label {
    font-size: 12px;
    color: var(--text-soft);
    text-align: right;
    margin-bottom: 20px;
  }

  /* ── SECTION BADGE ── */
  .section-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--brand);
    color: white;
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 16px;
    text-transform: uppercase;
  }

  /* ── QUESTION ── */
  .q-number {
    font-size: 13px;
    color: var(--text-soft);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .q-text {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.35;
    margin-bottom: 8px;
    color: var(--text);
  }
  .q-hint {
    font-size: 14px;
    color: var(--brand);
    background: var(--gold-light);
    border-left: 3px solid var(--gold);
    padding: 8px 12px;
    border-radius: 6px;
    margin-bottom: 20px;
    font-style: italic;
  }
  .q-display {
    font-size: 42px;
    font-weight: 900;
    color: var(--brand-dark);
    text-align: center;
    margin: 12px 0 24px;
    background: var(--gold-light);
    border-radius: 12px;
    padding: 16px;
    letter-spacing: 1px;
  }
  .q-display.q-display-html {
    font-size: 16px;
    font-weight: normal;
    letter-spacing: 0;
    padding: 12px;
  }

  /* ── OPTIONS ── */
  .options {
    display: grid;
    gap: 12px;
    margin-bottom: 24px;
  }
  .options.two-col   { grid-template-columns: 1fr 1fr; }
  .options.four-col  { grid-template-columns: 1fr 1fr; }

  .opt-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border: 2px solid var(--grey-mid);
    border-radius: 10px;
    background: var(--grey-light);
    cursor: pointer;
    font-size: 16px;
    font-weight: 500;
    text-align: left;
    transition: all 0.15s;
    color: var(--text);
    width: 100%;
  }
  .opt-btn:hover { border-color: var(--brand); background: var(--gold-light); }
  .opt-btn.selected {
    border-color: var(--brand);
    background: var(--gold-mid);
    font-weight: 700;
  }
  .opt-btn.correct {
    border-color: var(--green);
    background: var(--green-light);
    color: var(--green);
  }
  .opt-btn.wrong {
    border-color: var(--red-c);
    background: var(--red-light);
    color: var(--red-c);
    text-decoration: line-through;
    opacity: 0.8;
  }
  .opt-letter {
    width: 32px;
    height: 32px;
    min-width: 32px;
    border-radius: 6px;
    background: var(--brand);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 14px;
  }
  .opt-btn.correct .opt-letter { background: var(--green); }
  .opt-btn.wrong   .opt-letter { background: var(--red-c); }

  /* ── I DON'T KNOW BUTTON ── */
  .btn-speak {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--gold-light);
    border: 2px solid var(--gold);
    color: var(--brand-dark);
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 16px;
  }
  .btn-speak:hover { background: var(--gold-mid); }
  .btn-speak:active { transform: scale(0.97); }

  .btn-idk {
    width: 100%;
    padding: 11px;
    background: white;
    color: var(--text-soft);
    border: 2px dashed var(--grey-mid);
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 14px;
    transition: all 0.15s;
  }
  .btn-idk:hover { border-color: var(--text-soft); color: var(--text); }

  /* ── NEXT BUTTON ── */
  .btn-next {
    width: 100%;
    padding: 16px;
    background: var(--brand);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-next:hover { background: var(--brand-dark); }
  .btn-next:disabled { background: var(--grey-mid); color: var(--text-soft); cursor: not-allowed; }

  /* ── CHECKPOINT ── */
  .checkpoint {
    background: var(--gold-mid);
    border: 2px solid var(--gold);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 20px;
    text-align: center;
    font-size: 16px;
    font-weight: 700;
    color: var(--brand-dark);
  }
  .checkpoint .emoji { font-size: 28px; display: block; margin-bottom: 6px; }

  /* ── COVER PAGE ── */
  .cover-title {
    font-size: 28px;
    font-weight: 900;
    color: var(--brand-dark);
    margin-bottom: 6px;
  }
  .cover-sub {
    font-size: 15px;
    color: var(--text-soft);
    margin-bottom: 24px;
  }
  .instr-box {
    background: var(--gold-light);
    border: 2px solid var(--gold);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 24px;
  }
  .instr-box h3 {
    color: var(--brand-dark);
    font-size: 14px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }
  .instr-box li {
    font-size: 14px;
    color: var(--text);
    margin-bottom: 6px;
    margin-left: 16px;
  }
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group label { font-size: 13px; font-weight: 600; color: var(--text-soft); }
  .form-group input, .form-group select {
    padding: 10px 12px;
    border: 2px solid var(--grey-mid);
    border-radius: 8px;
    font-size: 15px;
    color: var(--text);
    background: white;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus, .form-group select:focus { border-color: var(--brand); }

  /* ── RESULTS PAGE ── */
  .result-hero { text-align: center; padding: 24px 0 16px; }
  .result-emoji { font-size: 64px; line-height: 1; margin-bottom: 12px; }
  .result-score { font-size: 52px; font-weight: 900; line-height: 1; margin-bottom: 4px; }
  .result-score.green { color: var(--green); }
  .result-score.amber { color: var(--amber); }
  .result-score.red-c { color: var(--red-c); }
  .rag-pill {
    display: inline-block;
    padding: 6px 20px;
    border-radius: 99px;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .rag-pill.green { background: var(--green-light); color: var(--green); }
  .rag-pill.amber { background: var(--amber-light); color: var(--amber); }
  .rag-pill.red-c { background: var(--red-light);   color: var(--red-c); }
  .placement-box {
    background: var(--brand);
    color: white;
    border-radius: 12px;
    padding: 16px 20px;
    margin: 16px 0;
    text-align: center;
  }
  .placement-box .label { font-size: 12px; opacity: 0.8; margin-bottom: 4px; }
  .placement-box .value { font-size: 22px; font-weight: 900; }

  .section-breakdown { margin-top: 20px; }
  .section-breakdown h3 {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-soft);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }
  .sec-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .sec-letter {
    width: 30px; height: 30px; min-width: 30px;
    border-radius: 6px; background: var(--brand); color: white;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px;
  }
  .sec-info { flex: 1; }
  .sec-name { font-size: 13px; font-weight: 600; }
  .sec-bar-wrap { height: 8px; background: var(--grey-mid); border-radius: 99px; margin-top: 4px; overflow: hidden; }
  .sec-bar { height: 100%; border-radius: 99px; transition: width 0.6s ease; }
  .sec-bar.green { background: var(--green); }
  .sec-bar.amber { background: var(--amber); }
  .sec-bar.red-c { background: var(--red-c); }
  .sec-score { font-size: 13px; font-weight: 700; min-width: 36px; text-align: right; }

  .summary-box {
    background: var(--grey-light);
    border-radius: 10px;
    padding: 16px;
    margin-top: 16px;
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
  }

  .submit-status {
    margin-top: 16px;
    padding: 12px;
    border-radius: 8px;
    font-size: 13px;
    text-align: center;
    font-weight: 600;
  }
  .submit-status.sending { background: var(--gold-light); color: var(--brand); }
  .submit-status.sent    { background: var(--green-light); color: var(--green); }
  .submit-status.error   { background: var(--red-light);   color: var(--red-c); }

  /* ── FRACTION DISPLAY ── */
  .frac {
    display: inline-flex; flex-direction: column;
    align-items: center; vertical-align: middle;
    margin: 0 4px; font-weight: 900; font-size: 0.9em;
  }
  .frac-line { border-top: 3px solid currentColor; width: 100%; margin: 2px 0; }

  @media print {
  header, .no-print, #btn-rep-back, #btn-rep-print, #btn-rep-print-summary,
  #btn-sv-back, #btn-print, #btn-teacher-mode { display: none !important; }
  body { background: white; font-size: 12px; }
  .card { box-shadow: none; margin: 0; padding: 12px; max-width: 100%; border-radius: 0; }
  #report-print-area { display: block !important; }
  table { font-size: 11px; }
  @page { margin: 1.5cm; }
}
@media (max-width: 480px) {
    .card { padding: 20px 16px; margin: 12px 10px; }
    .q-text { font-size: 18px; }
    .q-display { font-size: 32px; }
    .form-row { grid-template-columns: 1fr; }
    .options.two-col { grid-template-columns: 1fr; }
    .options.four-col { grid-template-columns: 1fr; }
  }
</style>
</head>

// Placement is computed server-side now (see Ignite_English_Code.gs) —

function getSectionRag(score, max) {
  const pct = score / max;
  if (pct >= 0.8) return "green";
  if (pct >= 0.5) return "amber";
  return "red-c";
}

// Plain-English "expected standard" labels for teachers/parents, mapped from
// the existing RAG logic (GREEN/AMBER/RED already represent Above/At/Below).
function getStandardLabel(rag) {
  if (rag === "GREEN") return "Working Above Expected Standard";
  if (rag === "AMBER") return "Working At Expected Standard";
  return "Working Below Expected Standard";
}
function getSectionStandardLabel(cls) {
  if (cls === "green") return "Above Expected";
  if (cls === "amber") return "At Expected";
  return "Below Expected";
}

// This baseline's designed target year group — used to flag when a child's
// entered Year doesn't match, since the Expected Standard label only means
// what it says when the content matches the child's actual year group.
const BASELINE_TARGET_YEARS = ["Year 3", "Year 4"];
function getYearMismatchNote(year) {
  if (!year) return "";
  const targetNums = BASELINE_TARGET_YEARS.map(y => parseInt(y.match(/\d+/)[0]));
  const minTarget = Math.min(...targetNums), maxTarget = Math.max(...targetNums);
  const m = year.match(/\d+/);
  const yearNum = year === "Reception" ? 0 : (m ? parseInt(m[0]) : null);
  if (yearNum === null) return ""; // "Other" or unrecognised — can't compare
  if (yearNum < minTarget) {
    return `⚠️ ${year} tested on a ${BASELINE_TARGET_YEARS.join('/')} baseline — this reflects performance on content above their normal year group, not their standing within ${year}.`;
  }
  if (yearNum > maxTarget) {
    return `⚠️ ${year} tested on a ${BASELINE_TARGET_YEARS.join('/')} baseline — this reflects performance on content below their normal year group, not their standing within ${year}.`;
  }
  return "";
}

// ── ACADEMIC YEAR / TERM — auto-derived from the sitting date, UK school-year cycle ──
function getAcademicYear(dateStr) {
  const d = dateStr ? new Date(dateStr) : new Date();
  if (isNaN(d)) return "";
  const y = d.getFullYear(), m = d.getMonth() + 1; // 1-12
  return (m >= 9) ? `${y}/${String(y + 1).slice(-2)}` : `${y - 1}/${String(y).slice(-2)}`;
}
function getTerm(dateStr) {
  const d = dateStr ? new Date(dateStr) : new Date();
  if (isNaN(d)) return "";
  const m = d.getMonth() + 1;
  if (m >= 9) return "Autumn";
  if (m <= 4) return "Spring";
  return "Summer";
}

// ── LIVE TIMER (tutor-facing pacing aid, not exam-style pressure) ───────────
// Counts up plainly, but shifts colour past soft thresholds so a supervising
// tutor can notice pacing at a glance without it feeling like a countdown or
// exam clock to the student. Thresholds match the cover page's own guidance
// (~20-25 min typical, try not to exceed 30).
function startQuizTimer() {
  stopQuizTimer(); // guard against double-starting
  state.timerInterval = setInterval(updateQuizTimerDisplay, 1000);
  updateQuizTimerDisplay();
}
function stopQuizTimer() {
  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
}
function updateQuizTimerDisplay() {
  const el = document.getElementById("quiz-timer");
  const textEl = document.getElementById("quiz-timer-text");
  if (!el || !textEl || !state.startTime) return;
  const elapsedSec = Math.floor((Date.now() - state.startTime) / 1000);
  const mins = Math.floor(elapsedSec / 60);
  const secs = elapsedSec % 60;
  textEl.textContent = mins + ":" + String(secs).padStart(2, "0");
  let color = "var(--text-soft)", bg = "var(--grey-light)"; // under 20 min
  if (elapsedSec >= 30 * 60) { color = "var(--red-c)"; bg = "var(--red-light)"; }     // past 30 min
  else if (elapsedSec >= 20 * 60) { color = "var(--amber)"; bg = "var(--amber-light)"; } // past 20 min
  el.style.color = color;
  el.style.background = bg;
}

// ── READ-ALOUD (Web Speech API) ─────────────────────────────────────────────
let cachedVoicesIgnite = [];
if (typeof window !== "undefined" && "speechSynthesis" in window) {
  cachedVoicesIgnite = window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => {
    cachedVoicesIgnite = window.speechSynthesis.getVoices();
  };
}
function pickFriendlyVoiceIgnite() {
  if (!cachedVoicesIgnite || !cachedVoicesIgnite.length) return null;
  return cachedVoicesIgnite.find(v => /en-GB/i.test(v.lang) && /female|natural/i.test(v.name))
      || cachedVoicesIgnite.find(v => /en-GB/i.test(v.lang))
      || cachedVoicesIgnite.find(v => /^en/i.test(v.lang))
      || null;
}
// Strips HTML/emoji, splits into sentences, speaks each with a real pause —
// avoids the rushed, robotic, run-together sound of one long utterance.
function speakText(text) {
  try {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    let plain = String(text).replace(/<[^>]*>/g, " ");
    plain = plain.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{2190}-\u{21FF}]/gu, "");
    plain = plain.replace(/\s+/g, " ").trim();
    if (!plain) return;
    const sentences = (plain.match(/[^.!?]+[.!?]?/g) || [plain]).map(s => s.trim()).filter(Boolean);
    const voice = pickFriendlyVoiceIgnite();
    let i = 0;
    function speakNext() {
      if (i >= sentences.length) return;
      const utter = new SpeechSynthesisUtterance(sentences[i]);
      i++;
      utter.lang = "en-GB";
      utter.rate = 0.88;
      utter.pitch = 1.1;
      if (voice) utter.voice = voice;
      utter.onend = () => setTimeout(speakNext, 350);
      window.speechSynthesis.speak(utter);
    }
    speakNext();
  } catch(e) {}
}

      phase:     state.phase,
      student:   state.student,
      qIndex:    state.qIndex,
      answers:   state.answers,
      selected:  state.selected,
      revealed:  state.revealed,
      startTime: state.startTime,
    }));
  } catch(e) {}
}

function loadSavedState() {
  try {
    const saved = localStorage.getItem(SAVE_KEY);
    if (saved) {
      const s = JSON.parse(saved);
      if (s.phase === "quiz" && s.student && s.student.name) return s;
    }
  } catch(e) {}
  return null;
}

  try { localStorage.removeItem(SAVE_KEY); } catch(e) {}

        <span style="font-size:13px;">⏱️</span><span id="quiz-timer-text">0:00</span>
      </div>
    </div>
  `;

  // Checkpoint banner (shows before revealing answer)
  if (q.checkpoint && !state.revealed) {
    html += `<div class="checkpoint"><span class="emoji">${q.checkpoint.slice(-2)}</span>${q.checkpoint.slice(0,-2).trim()}</div>`;
  }

  // Combine stem + plain-text display (sentence/cloze) for read-aloud, so the
  // speaker button reads the full context, not just the bare instruction.
  // Skipped for Section A (decoding is the point) and for HTML displays
  // (the shared passage already has its own dedicated speak button).
  let spokenPayload = q.text;
  if (!secMeta.noAudio && q.display && typeof q.display === "string" && !q.display.trim().startsWith("<")) {
    spokenPayload += ". " + q.display.replace(/___/g, "blank");
  }

  html += `
    <div class="section-badge" style="background:${secMeta.color}">
      ${q.sec} · ${secMeta.name}
    </div>
    <div class="q-number">Question ${q.id}</div>
    <div class="q-text" id="q-text-${q.id}">${q.text}</div>
  `;
  if (!secMeta.noAudio) {
    html += `<div id="q-speak-src-${q.id}" style="display:none">${spokenPayload}</div>`;
    html += `<button type="button" class="btn-speak" data-speak-target="q-speak-src-${q.id}">🔊 Read this question aloud</button>`;
  }

  if (q.display) {
    const isHtml = q.display.trim().startsWith('<');
    html += `<div class="q-display${isHtml ? ' q-display-html' : ''}">${q.display}</div>`;
  }
  if (q.hint) {
    html += `<div class="q-hint">💡 ${q.hint}</div>`;
  }

  // Options — always 4, always 2-col grid — NO reveal of correct/wrong to student
  html += `<div class="options four-col">`;
  q.opts.forEach((opt, i) => {
    const letter = letters[i];
    const cls = (letter === state.selected) ? "selected" : "";
    html += `
      <button class="opt-btn ${cls}" data-letter="${letter}">
        <span class="opt-letter">${letter}</span>
        ${q.opts[i]}
      </button>
    `;
  });
  html += `</div>`;

  const isLast = state.qIndex === total - 1;
  const btnLabel = isLast ? "Submit my answers 🎉" : "Next question →";

  // IDK button only if nothing selected yet
  if (!state.selected) {
    html += `<button class="btn-idk" id="btn-idk">🤷 I don't know — skip this one</button>`;
  }

  html += `<button class="btn-next" id="btn-next" ${!state.selected ? "disabled" : ""}>${btnLabel}</button>`;
  html += `<div style="text-align:center;margin-top:14px">
    <button id="btn-teacher-mode-quiz" style="background:none;border:none;color:var(--text-soft);font-size:11px;cursor:pointer;text-decoration:underline;padding:4px 8px;">🔒 Teacher Mode</button>
  </div>`;
  return html;
}

const TEACHER_PIN = "2468";
const RESULTS_STORE_KEY = "aimhigh_ignite_english_all_results";
let teacherResultsCache = null; // null = not fetched yet / fetch failed, use local fallback
let dashboardFilters = { search: "", year: "", rag: "", teacher: "", className: "", dateFrom: "", dateTo: "", academicYear: getAcademicYear(), term: "", status: "Enrolled Student" };

// Normalizes any academic-year string to the "YYYY/YY" format, so older
// rows saved with the previous hyphen format ("2025-26", from before this
// was fixed) are treated as identical to new slash-formatted rows.
function normalizeAcademicYear(val) {
  if (!val) return val;
  const m = String(val).match(/^(\d{4})[\/-](\d{2})$/);
  return m ? `${m[1]}/${m[2]}` : val;
}

// Correct answers are PIN-gated and fetched only once Teacher Mode is
// unlocked — never sitting in the page for an unauthenticated visitor.
let teacherAnswerKey = {};
function loadTeacherAnswerKey() {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("PASTE_YOUR")) return Promise.resolve();
  return fetch(APPS_SCRIPT_URL + "?action=getAnswerKey&pin=" + encodeURIComponent(TEACHER_PIN))
    .then(r => r.json())
    .then(data => { teacherAnswerKey = data.answers || {}; })
    .catch(() => { teacherAnswerKey = {}; });
}

function saveResultsToStore(studentData) {
  try {
    const all = getStoredResults();
    all.unshift(studentData); // newest first
    // Keep last 50 students
    if (all.length > 50) all.splice(50);
    localStorage.setItem(RESULTS_STORE_KEY, JSON.stringify(all));
  } catch(e) {}
}

function getStoredResults() {
  try {
    const raw = localStorage.getItem(RESULTS_STORE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e) { return []; }
}

function formatDateNice(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
}

function normalizeRemoteResult(row) {
  // Prefer the raw "Answers JSON" column (exact letters the student picked)
  // if present — this gives full per-question review, same as on the
  // device the student actually used. Older rows submitted before this
  // column existed fall back to a correctness-only reconstruction from
  // Q1-Q34 (right/wrong), which can't show which specific wrong option
  // was chosen, only that it was wrong.
  let answers = null;
  if (row["Answers JSON"]) {
    try { answers = JSON.parse(row["Answers JSON"]); } catch(e) { answers = null; }
  }
  if (!answers) {
    answers = {};
    QUESTIONS.forEach(q => {
      const isCorrect = Number(row["Q" + q.id]) === 1;
      answers[q.id] = isCorrect ? teacherAnswerKey[q.id] : "✗";
    });
  }

  return {
    timestamp:   row["Timestamp"],
    name:        row["Name"],
    year:        row["Year"],
    school:      row["School"],
    teacher:     row["Teacher"],
    date:        row["Date"],
    academicYear: normalizeAcademicYear(row["Academic Year"]),
    term:         row["Term"],
    studentStatus: row["Student Status"],
    className:   row["Class"] || "",
    total:       Number(row["Total"]) || 0,
    rag:         row["RAG"],
    placement:   row["Group Placed"],
    teacherNote: row["Teacher Action Note"],
    timeTaken:   row["Time Taken"],
    tutorComment: row["Tutor Comments"] || "",
    writingSample: row["Writing Sample"] || "",
    aiWritingFeedback: row["AI Writing Feedback"] || "",
    secScores: {
      A: getSecScoreByPrefixIgnite(row, "A"),
      B: getSecScoreByPrefixIgnite(row, "B"),
      C: getSecScoreByPrefixIgnite(row, "C"),
      D: getSecScoreByPrefixIgnite(row, "D"),
      E: getSecScoreByPrefixIgnite(row, "E"),
      F: getSecScoreByPrefixIgnite(row, "F"),
      G: getSecScoreByPrefixIgnite(row, "G"),
      H: getSecScoreByPrefixIgnite(row, "H"),
    },
    answers: answers,
  };
}

// Matches header by PREFIX ("Sec A ") rather than the full exact string
// ("Sec A (6)") — immune to a sheet header still showing an old bracketed
// max after a future difficulty-calibration pass changes a section's size.
function getSecScoreByPrefixIgnite(row, letter) {
  const prefix = "Sec " + letter + " ";
  const key = Object.keys(row).find(k => k.indexOf(prefix) === 0);
  return key ? (Number(row[key]) || 0) : 0;
}

function fetchRemoteResults() {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("PASTE_YOUR")) {
    return Promise.resolve(null);
  }
  return fetch(APPS_SCRIPT_URL + "?pin=" + encodeURIComponent(TEACHER_PIN))
    .then(res => res.json())
    .then(rows => Array.isArray(rows) ? rows.map(normalizeRemoteResult) : null)
    .catch(() => null);
}

function saveTutorComment(r) {
  const statusEl = document.getElementById("comment-save-status");
  const comment = document.getElementById("tutor-comment-box").value;

  if (!r.timestamp) {
    statusEl.textContent = "⚠️ Can't save — this result predates comment support.";
    statusEl.style.color = "var(--red-c)";
    return;
  }
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("PASTE_YOUR")) {
    statusEl.textContent = "⚠️ Apps Script URL not configured.";
    statusEl.style.color = "var(--red-c)";
    return;
  }

  statusEl.textContent = "Saving...";
  statusEl.style.color = "var(--text-soft)";

  fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({ action: "addComment", timestamp: r.timestamp, comment: comment }),
  })
    .then(res => res.json())
    .then(res => {
      if (res.status === "ok") {
        r.tutorComment = comment;
        if (teacherResultsCache) {
          const match = teacherResultsCache.find(x => x.timestamp === r.timestamp);
          if (match) match.tutorComment = comment;
        }
        const local = getStoredResults();
        const localMatch = local.find(x => x.timestamp === r.timestamp);
        if (localMatch) {
          localMatch.tutorComment = comment;
          localStorage.setItem(RESULTS_STORE_KEY, JSON.stringify(local));
        }
        statusEl.textContent = "✅ Saved";
        statusEl.style.color = "#166534";
      } else {
        statusEl.textContent = "⚠️ Could not save — " + (res.message || "unknown error");
        statusEl.style.color = "var(--red-c)";
      }
    })
    .catch(() => {
      statusEl.textContent = "⚠️ Could not reach Google Sheet.";
      statusEl.style.color = "var(--red-c)";
    });
}

// Fires ONLY when the teacher clicks the button — never automatically on
// submission. Sends the writing sample to the Apps Script backend, which
// calls the Anthropic API server-side (API key never touches this HTML file)
// and returns/persists rubric feedback.
function analyzeWritingSample(r, btnEl) {
  const statusEl = document.getElementById("writing-analyze-status");
  const feedbackBlock = document.getElementById("writing-feedback-block");

  if (!r.timestamp) {
    statusEl.textContent = "⚠️ Can't analyse — missing timestamp for this result.";
    statusEl.style.color = "var(--red-c)";
    return;
  }
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("PASTE_YOUR")) {
    statusEl.textContent = "⚠️ Apps Script URL not configured.";
    statusEl.style.color = "var(--red-c)";
    return;
  }

  btnEl.disabled = true;
  statusEl.textContent = "Analysing... (takes a few seconds)";
  statusEl.style.color = "var(--text-soft)";

  fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({ action: "analyzeWriting", timestamp: r.timestamp, writingText: r.writingSample }),
  })
    .then(res => res.json())
    .then(res => {
      btnEl.disabled = false;
      if (res.status === "ok" && res.feedback) {
        r.aiWritingFeedback = JSON.stringify(res.feedback);
        if (teacherResultsCache) {
          const match = teacherResultsCache.find(x => x.timestamp === r.timestamp);
          if (match) match.aiWritingFeedback = r.aiWritingFeedback;
        }
        feedbackBlock.innerHTML = renderWritingFeedbackBlock(res.feedback);
        btnEl.textContent = "🤖 Re-analyse Writing (AI)";
        statusEl.textContent = "✅ Analysis complete";
        statusEl.style.color = "#166534";
      } else {
        statusEl.textContent = "⚠️ " + (res.message || "Could not analyse writing.");
        statusEl.style.color = "var(--red-c)";
      }
    })
    .catch(() => {
      btnEl.disabled = false;
      statusEl.textContent = "⚠️ Could not reach Google Sheet.";
      statusEl.style.color = "var(--red-c)";
    });
}

function passesFilters(r) {
  if (dashboardFilters.search && !(r.name||"").toLowerCase().includes(dashboardFilters.search.toLowerCase())) return false;
  if (dashboardFilters.year && r.year !== dashboardFilters.year) return false;
  if (dashboardFilters.rag && r.rag !== dashboardFilters.rag) return false;
  if (dashboardFilters.teacher && r.teacher !== dashboardFilters.teacher) return false;
  if (dashboardFilters.className && r.className !== dashboardFilters.className) return false;
  if (dashboardFilters.academicYear && r.academicYear !== dashboardFilters.academicYear) return false;
  if (dashboardFilters.term && r.term !== dashboardFilters.term) return false;
  if (dashboardFilters.status && r.studentStatus !== dashboardFilters.status) return false;
  if (dashboardFilters.dateFrom) {
    const d = new Date(r.date);
    const from = new Date(dashboardFilters.dateFrom);
    if (isNaN(d) || d < from) return false;
  }
  if (dashboardFilters.dateTo) {
    const d = new Date(r.date);
    const to = new Date(dashboardFilters.dateTo);
    to.setHours(23,59,59,999);
    if (isNaN(d) || d > to) return false;
  }
  return true;
}

      <select id="td-filter-status" style="width:100%;border:2px solid var(--grey-mid);border-radius:8px;padding:8px 10px;font-size:13px;">
        <option value="Enrolled Student" ${dashboardFilters.status==='Enrolled Student'?'selected':''}>Enrolled Students</option>
        <option value="Trial Student" ${dashboardFilters.status==='Trial Student'?'selected':''}>Trial Students</option>
        <option value="" ${dashboardFilters.status===''?'selected':''}>All Students</option>
      </select>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
      <div>
        <label style="font-size:11px;color:var(--text-soft);display:block;margin-bottom:2px">From date</label>
        <input id="td-filter-from" type="date" value="${dashboardFilters.dateFrom}" style="width:100%;border:2px solid var(--grey-mid);border-radius:8px;padding:7px 10px;font-size:13px;">
      </div>
      <div>
        <label style="font-size:11px;color:var(--text-soft);display:block;margin-bottom:2px">To date</label>
        <input id="td-filter-to" type="date" value="${dashboardFilters.dateTo}" style="width:100%;border:2px solid var(--grey-mid);border-radius:8px;padding:7px 10px;font-size:13px;">
      </div>
    </div>
    ${(dashboardFilters.search||dashboardFilters.year||dashboardFilters.rag||dashboardFilters.teacher||dashboardFilters.className||dashboardFilters.dateFrom||dashboardFilters.dateTo||dashboardFilters.term||dashboardFilters.academicYear!==getAcademicYear()||dashboardFilters.status!=="Enrolled Student")
      ? `<button id="td-clear-filters" style="background:none;border:none;color:var(--brand-dark);font-size:12px;font-weight:600;cursor:pointer;text-decoration:underline;margin-bottom:12px;padding:0;">✕ Reset to default view</button>`
      : ''}
    <div style="font-size:12px;color:var(--text-soft);margin-bottom:12px">Showing ${filtered.length} of ${all.length} result${all.length===1?'':'s'}</div>
  `;

  if (filtered.length === 0) {
    html += `<div style="text-align:center;color:var(--text-soft);padding:32px 0;font-size:15px;">
      ${all.length === 0 ? 'No results found yet — complete an assessment first.' : 'No students match these filters.'}
    </div>`;
    // Diagnostic: if there ARE rows fetched but every one is being filtered out
    // even with blank filters, show the raw data of the first row so we can
    // see exactly what's in it rather than guessing.
    if (all.length > 0 && filtered.length === 0) {
      html += `<details style="margin-top:8px;font-size:11px;color:var(--text-soft)">
        <summary style="cursor:pointer;font-weight:700">🔧 Diagnostic info (tap to expand, for troubleshooting)</summary>
        <div style="margin-top:8px">Current filters: <code>${escapeHtml(JSON.stringify(dashboardFilters))}</code></div>
        <div style="margin-top:8px">First row raw data:</div>
        <pre style="white-space:pre-wrap;word-break:break-all;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px;margin-top:4px">${escapeHtml(JSON.stringify(all[0], null, 2))}</pre>
      </details>`;
    }
  } else {
    filtered.forEach((r) => {
      const ragBg  = r.rag==="GREEN"?"#DCFCE7":r.rag==="AMBER"?"#FEF3C7":"#FEE2E2";
      const ragFg  = r.rag==="GREEN"?"#14532D":r.rag==="AMBER"?"#92400E":"#7F1D1D";
      html += `
        <div class="student-card" data-idx="${all.indexOf(r)}"
          style="border:2px solid var(--grey-mid);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:12px;">
          <div style="flex:1">
            <div style="font-weight:700;font-size:15px;">${r.name}</div>
            <div style="font-size:12px;color:var(--text-soft);">${r.year} · ${r.school||''} · ${formatDateNice(r.date)}${r.timeTaken ? ` · ⏱️ ${r.timeTaken}` : ''}</div>
          </div>
          <div style="text-align:right">
            <div style="font-size:20px;font-weight:900;color:var(--brand-dark)">${r.total}/37</div>
            <span style="background:${ragBg};color:${ragFg};font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;">${r.placement||r.rag}</span>
            <div style="font-size:10px;color:var(--text-soft);margin-top:3px;font-weight:600;">${getStandardLabel(r.rag)}</div>
          </div>
          <div style="font-size:18px;color:var(--grey-mid)">›</div>
        </div>
      `;
    });
  }

  app.innerHTML = html;

  document.getElementById("btn-td-back").addEventListener("click", () => render());
  document.getElementById("btn-td-walkthrough").addEventListener("click", () => renderWalkthrough(0));
  document.getElementById("btn-td-livemonitor").addEventListener("click", () => renderLiveMonitor());
  document.getElementById("btn-td-refresh").addEventListener("click", () => {
    renderTeacherLoading();
    fetchRemoteResults().then(remote => {
      teacherResultsCache = remote;
      renderTeacherDashboard();
    });
  });
  document.getElementById("td-search").addEventListener("input", e => {
    dashboardFilters.search = e.target.value;
    renderTeacherDashboard();
  });
  document.getElementById("td-filter-year").addEventListener("change", e => {
    dashboardFilters.year = e.target.value;
    renderTeacherDashboard();
  });
  document.getElementById("td-filter-rag").addEventListener("change", e => {
    dashboardFilters.rag = e.target.value;
    renderTeacherDashboard();
  });
  document.getElementById("td-filter-teacher").addEventListener("change", e => {
    dashboardFilters.teacher = e.target.value;
    renderTeacherDashboard();
  });
  document.getElementById("td-filter-class").addEventListener("change", e => {
    dashboardFilters.className = e.target.value;
    renderTeacherDashboard();
  });
  document.getElementById("td-filter-ay").addEventListener("change", e => {
    dashboardFilters.academicYear = e.target.value;
    renderTeacherDashboard();
  });
  document.getElementById("td-filter-term").addEventListener("change", e => {
    dashboardFilters.term = e.target.value;
    renderTeacherDashboard();
  });
  document.getElementById("td-filter-status").addEventListener("change", e => {
    dashboardFilters.status = e.target.value;
    renderTeacherDashboard();
  });
  document.getElementById("td-filter-from").addEventListener("change", e => {
    dashboardFilters.dateFrom = e.target.value;
    renderTeacherDashboard();
  });
  document.getElementById("td-filter-to").addEventListener("change", e => {
    dashboardFilters.dateTo = e.target.value;
    renderTeacherDashboard();
  });
  const clearBtn = document.getElementById("td-clear-filters");
  if (clearBtn) {
    clearBtn.addEventListener("click", () => {
      dashboardFilters = { search: "", year: "", rag: "", teacher: "", className: "", dateFrom: "", dateTo: "", academicYear: getAcademicYear(), term: "", status: "Enrolled Student" };
      renderTeacherDashboard();
    });
  }
  document.querySelectorAll(".student-card").forEach(card => {
    card.addEventListener("click", () => {
      const idx = parseInt(card.dataset.idx);
      renderTeacherStudentView(all[idx]);
    });
  });
}

// ── Q DETAIL VIEW (click a question to see it as student saw it) ─────────────
function renderQuestionDetail(r, qIndex, filter) {
  // filter: 'all', 'wrong', 'skipped'
  const filterFn = filter === 'wrong'
    ? q => { const a = r.answers[q.id]; return a && a !== 'IDK' && a !== teacherAnswerKey[q.id]; }
    : filter === 'skipped'
    ? q => { const a = r.answers[q.id]; return !a || a === 'IDK'; }
    : () => true;

  const filteredQs = QUESTIONS.filter(filterFn);
  if (filteredQs.length === 0) {
    renderTeacherStudentView(r);
    return;
  }
  const q       = filteredQs[qIndex] || filteredQs[0];
  const given   = r.answers[q.id];
  const correct = given && given !== 'IDK' && given === teacherAnswerKey[q.id];
  const idk     = given === 'IDK';
  const letters = ['A','B','C','D'];
  const secMeta = SECTIONS[q.sec];

  let html = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap">
      <button id="btn-qd-back" style="background:none;border:2px solid #e2e8f0;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;">← Back</button>
      <div style="flex:1;font-size:13px;font-weight:700;color:#1a3a5c">${r.name} — Q${q.id}</div>
      <div style="display:flex;gap:6px">
        ${qIndex > 0 ? `<button class="btn-qd-nav" data-dir="-1" style="background:#1a3a5c;color:white;border:none;border-radius:8px;padding:6px 14px;font-weight:700;cursor:pointer;font-size:14px">◀</button>` : ''}
        ${qIndex < filteredQs.length-1 ? `<button class="btn-qd-nav" data-dir="1" style="background:#1a3a5c;color:white;border:none;border-radius:8px;padding:6px 14px;font-weight:700;cursor:pointer;font-size:14px">▶</button>` : ''}
      </div>
    </div>

    <!-- Filter tabs -->
    <div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap">
      ${['all','wrong','skipped'].map(f => `
        <button class="btn-filter" data-filter="${f}"
          style="padding:5px 12px;border-radius:20px;border:2px solid ${f===filter?'#1a3a5c':'#e2e8f0'};
          background:${f===filter?'#1a3a5c':'white'};color:${f===filter?'white':'#64748b'};
          font-size:12px;font-weight:700;cursor:pointer;">
          ${f==='all'?'All questions':f==='wrong'?'❌ Wrong only':'⬜ Skipped only'}
        </button>`).join('')}
    </div>

    <div style="font-size:12px;color:#94a3b8;text-align:center;margin-bottom:10px">
      Question ${qIndex+1} of ${filteredQs.length}${filter!=='all'?' (filtered)':''}
    </div>

    <!-- Section badge -->
    <div style="display:inline-flex;align-items:center;gap:6px;background:${secMeta.color};color:white;
      border-radius:8px;padding:4px 12px;font-size:11px;font-weight:700;letter-spacing:0.5px;
      text-transform:uppercase;margin-bottom:12px">${q.sec} · ${secMeta.name}</div>

    <!-- Question card -->
    <div style="background:white;border:2px solid #bfdbfe;border-radius:16px;padding:20px;margin-bottom:12px">
      <div style="font-size:12px;color:#94a3b8;margin-bottom:4px">Question ${q.id}</div>
      <div style="font-size:18px;font-weight:700;color:#1a1a1a;line-height:1.4;margin-bottom:14px">${q.text}</div>
  `;

  if (q.display) {
    const isHtml = q.display.trim().startsWith('<');
    html += `<div class="q-display${isHtml?' q-display-html':''}" style="margin-bottom:14px">${q.display}</div>`;
  }

  // Options with student answer and correct shown
  html += `<div class="options four-col">`;
  letters.forEach((letter, i) => {
    const isCorrect  = letter === teacherAnswerKey[q.id];
    const isSelected = letter === given;
    let bg = '#f5f5f5'; let border = '#e0e0e0'; let color = '#1a1a1a'; let label = '';
    if (isCorrect)  { bg='#DCFCE7'; border='#16a34a'; color='#14532D'; label=' ✅ Correct'; }
    if (isSelected && !isCorrect) { bg='#FEE2E2'; border='#dc2626'; color='#7F1D1D'; label=' ❌ Student chose this'; }
    if (isSelected && isCorrect)  { label=' ✅ Student got this right'; }
    html += `
      <div style="background:${bg};border:2px solid ${border};border-radius:10px;
        padding:12px 14px;font-size:14px;font-weight:${isCorrect||isSelected?'700':'500'};
        color:${color};display:flex;align-items:flex-start;gap:8px">
        <span style="width:26px;height:26px;min-width:26px;border-radius:6px;background:${isCorrect?'#16a34a':isSelected?'#dc2626':'#1a3a5c'};
          color:white;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px">${letter}</span>
        <span>${q.opts[i]}${label}</span>
      </div>`;
  });
  html += `</div>`;

  if (idk) {
    html += `<div style="background:#f1f5f9;border:2px dashed #94a3b8;border-radius:10px;padding:10px 14px;
      font-size:13px;color:#64748b;margin-top:8px">🤷 Student selected: <strong>I don't know</strong>
      &nbsp;·&nbsp; Correct answer: <strong>${teacherAnswerKey[q.id]} — ${q.opts[letters.indexOf(teacherAnswerKey[q.id])]}</strong></div>`;
  }

  html += `</div>`;
  document.getElementById('app').innerHTML = html;

  document.getElementById('btn-qd-back').addEventListener('click', () => renderTeacherStudentView(r));
  document.querySelectorAll('.btn-qd-nav').forEach(btn => {
    btn.addEventListener('click', () => {
      const newIdx = qIndex + parseInt(btn.dataset.dir);
      renderQuestionDetail(r, newIdx, filter);
    });
  });
  document.querySelectorAll('.btn-filter').forEach(btn => {
    btn.addEventListener('click', () => renderQuestionDetail(r, 0, btn.dataset.filter));
  });
}

// ── PARENT REPORT ─────────────────────────────────────────────────────────────
function renderParentReport(r) {
  const ragBg  = r.rag==='GREEN'?'#DCFCE7':r.rag==='AMBER'?'#FEF3C7':'#FEE2E2';
  const ragFg  = r.rag==='GREEN'?'#14532D':r.rag==='AMBER'?'#92400E':'#7F1D1D';
  const ragHex = r.rag==='GREEN'?'#16a34a':r.rag==='AMBER'?'#f59e0b':'#dc2626';
  const pct    = Math.round((r.total/37)*100);

  // Build strengths and weaknesses
  const secKeys = ['A','B','C','D','E','F','G','H'];
  const strengths = [], weaknesses = [], developing = [];
  secKeys.forEach(s => {
    const sc  = r.secScores ? (r.secScores[s]||0) : 0;
    const mx  = SEC_MAX[s];
    const p   = Math.round(sc/mx*100);
    if (p >= 80) strengths.push({s, sc, mx, p});
    else if (p < 50) weaknesses.push({s, sc, mx, p});
    else developing.push({s, sc, mx, p});
  });

  // Written summary paragraph
  const fname = r.name.split(' ')[0];
  let para = `${r.name} completed the Aim High Tuition Ignite English Baseline Assessment on ${formatDateNice(r.date)||'–'}, `;
  para += `achieving a score of <strong>${r.total} out of 37 (${pct}%)</strong>. `;
  if (r.rag==='GREEN') {
    para += `This is an excellent result. ${fname} has demonstrated a strong grasp of the key English topics assessed. `;
  } else if (r.rag==='AMBER') {
    para += `This is a solid performance showing good understanding across several areas. There are some specific topics where targeted support will help ${fname} reach their full potential. `;
  } else {
    para += `This result indicates that ${fname} would benefit from focused support to strengthen their foundational mathematics skills before progressing. `;
  }
  if (strengths.length) {
    para += `${fname} showed particular strength in: <strong>${strengths.map(x=>SECTIONS[x.s].name).join(', ')}</strong>. `;
  }
  if (weaknesses.length) {
    para += `Priority areas for development include: <strong>${weaknesses.map(x=>SECTIONS[x.s].name).join(', ')}</strong>. `;
  }
  para += `Based on these results, the recommended placement is <strong>${r.placement}</strong>.`;

  // Q by Q table
  let qRows = '';
  QUESTIONS.forEach(q => {
    const given   = r.answers ? r.answers[q.id] : null;
    const correct = given && given !== 'IDK' && given === teacherAnswerKey[q.id];
    const idk     = given === 'IDK';
    const icon    = correct ? '✅' : idk ? '⬜' : '❌';
    const bg      = correct ? '#f0fdf4' : idk ? '#f8fafc' : '#fef2f2';
    const givenTxt = given && given !== 'IDK'
      ? `${given} — ${q.opts[['A','B','C','D'].indexOf(given)]||given}`
      : given === 'IDK' ? 'I don\'t know' : '–';
    const corrTxt = `${teacherAnswerKey[q.id]} — ${q.opts[['A','B','C','D'].indexOf(teacherAnswerKey[q.id])]||teacherAnswerKey[q.id]}`;
    qRows += `
      <tr style="background:${bg}">
        <td style="padding:5px 8px;font-weight:700;text-align:center;border:1px solid #e2e8f0">${q.id}</td>
        <td style="padding:5px 8px;border:1px solid #e2e8f0">${q.sec}</td>
        <td style="padding:5px 8px;border:1px solid #e2e8f0;font-size:11px">${q.text.slice(0,55)}${q.text.length>55?'…':''}</td>
        <td style="padding:5px 8px;text-align:center;border:1px solid #e2e8f0">${icon}</td>
        <td style="padding:5px 8px;font-size:11px;border:1px solid #e2e8f0;color:${correct?'#14532D':idk?'#94a3b8':'#dc2626'}">${givenTxt}</td>
        <td style="padding:5px 8px;font-size:11px;border:1px solid #e2e8f0;color:#14532D">${correct?'–':corrTxt}</td>
      </tr>`;
  });

  const app = document.getElementById('app');
  app.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;print-none" class="no-print">
      <button id="btn-rep-back" style="background:none;border:2px solid #e2e8f0;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;">← Back</button>
      <div style="flex:1;font-weight:700;color:#1a3a5c">Parent Report — ${r.name}</div>
      <button id="btn-rep-print" style="background:#1a3a5c;color:white;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;">🖨️ Print Full Report</button>

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function renderWritingFeedbackBlock(fb) {
  const areas = [
    { key:"ideas",      label:"Ideas & Content" },
    { key:"structure",  label:"Sentence Structure" },
    { key:"vocabulary", label:"Vocabulary" },
    { key:"spelling",   label:"Spelling & Punctuation" },
  ];
  let html = '<div style="margin-top:12px;border-top:1px solid #e2e8f0;padding-top:12px">';
  areas.forEach(a => {
    const d = fb[a.key];
    if (!d) return;
    html += `<div style="margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;font-size:13px">
        <span style="font-weight:700">${a.label}</span>
        <span style="font-weight:900;color:#37474F">${d.score}/4</span>
      </div>
      <div style="font-size:12px;color:#64748b">${escapeHtml(d.comment||'')}</div>
    </div>`;
  });
  if (fb.summary) {
    html += `<div style="margin-top:10px;background:#F3F4F6;border-radius:8px;padding:10px;font-size:13px;color:#1a1a1a">${escapeHtml(fb.summary)}</div>`;
  }
  html += '</div>';
  return html;
}

// Writing Sample is deliberately NEVER scored automatically — this panel
// only shows the raw text plus an on-demand "Analyse Writing" button. The
// AI call only fires when a teacher explicitly clicks it, not on every
// submission, keeping cost down and keeping a human as the actual
// decision-maker (same principle as Tutor Comments).
function renderWritingSamplePanel(r) {
  const hasSample = r.writingSample && r.writingSample.trim().length > 0;
  if (!hasSample) {
    return `<div style="background:white;border:2px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:14px">
      <div style="font-weight:900;font-size:14px;margin-bottom:6px;color:#1a3a5c">✍️ Writing Sample</div>
      <div style="font-size:12px;color:#94a3b8">No writing sample recorded for this sitting.</div>
    </div>`;
  }
  let existingFeedback = null;
  if (r.aiWritingFeedback) {
    try { existingFeedback = JSON.parse(r.aiWritingFeedback); } catch(e) {}
  }
  return `<div style="background:white;border:2px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:14px">
    <div style="font-weight:900;font-size:14px;margin-bottom:6px;color:#1a3a5c">✍️ Writing Sample</div>

    <button id="btn-analyze-writing" data-timestamp="${r.timestamp}" style="background:#37474F;color:white;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;">🤖 ${existingFeedback ? 'Re-analyse' : 'Analyse'} Writing (AI)</button>
    <span id="writing-analyze-status" style="font-size:12px;color:#64748b;margin-left:10px"></span>
    <div id="writing-feedback-block">${existingFeedback ? renderWritingFeedbackBlock(existingFeedback) : ''}</div>
  </div>`;
}

// ── EVENTS ───────────────────────────────────────────────────────────────────
function attachEvents() {
  const btnStart = document.getElementById("btn-start");
  if (btnStart) {
    btnStart.addEventListener("click", () => {
      const name    = document.getElementById("f-name").value.trim();
      const surname = document.getElementById("f-surname").value.trim();
      const year    = document.getElementById("f-year").value;
      const school  = document.getElementById("f-school").value.trim();
      const teacherSel = document.getElementById("f-teacher").value;
      const teacher = teacherSel === "__other__"
        ? document.getElementById("f-teacher-other").value.trim()
        : teacherSel;
      const status  = document.getElementById("f-status").value;
      const date    = document.getElementById("f-date").value;
      if (!name || !year) {
        alert("Please enter your first name and year group to start.");
        return;
      }
      state.student = {
        name: name + (surname ? " " + surname : ""), year, school, teacher, date,
        academicYear: getAcademicYear(date), term: getTerm(date), status: status,
        className: resolveSelectedClass()
      };
      state.startTime = Date.now();
      state.startTimestamp = new Date().toISOString();
      state.phase = "practice";
      state.qIndex = 0;
      render();
    });
  }

  // Practice question — untimed, unscored
  document.querySelectorAll("[data-practice-letter]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.practiceSelected = btn.dataset.practiceLetter;
      render();
    });
  });
  const btnPracticeNext = document.getElementById("btn-practice-next");
  if (btnPracticeNext) {
    btnPracticeNext.addEventListener("click", () => {
      state.startTime = Date.now(); // real timing starts now, not during practice
      state.startTimestamp = new Date().toISOString();
      state.phase = "quiz";
      render();
      startQuizTimer();
      startDraftAutoSave();
    });
  }

  // Writing Task — untimed, not scored, but no longer skippable
  const writingBox = document.getElementById("writing-sample-box");
  if (writingBox) {
    writingBox.addEventListener("input", () => { state.writingText = writingBox.value; });
  }
  const btnWritingDone = document.getElementById("btn-writing-done");
  if (btnWritingDone) {
    btnWritingDone.addEventListener("click", () => {
      const text = writingBox ? writingBox.value.trim() : "";
      if (text.length < 10) {
        alert("Please write at least a sentence or two before finishing.");
        return;
      }
      state.writingText = text;
      state.phase = "results";
      render();
    });
  }

  // Read-aloud speaker buttons
  document.querySelectorAll(".btn-speak").forEach(btn => {
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const targetId = btn.dataset.speakTarget;
      const el = targetId ? document.getElementById(targetId) : null;
      speakText(el ? el.textContent : btn.closest(".q-text, div").textContent);
    });
  });

  // Teacher dropdown — populate from Google Sheet + toggle "Other" text box
  const selTeacher = document.getElementById("f-teacher");
  if (selTeacher) {
    populateTutorSelect();
    const otherBox = document.getElementById("f-teacher-other");
    selTeacher.addEventListener("change", () => {
      otherBox.style.display = selTeacher.value === "__other__" ? "block" : "none";
    });
  }

  // Class dropdown — same pattern as every other paper
  if (document.getElementById("f-class")) {
    loadClasses();
  }

  // Check for a resumable in-progress draft whenever the identifying fields change
  ["f-name", "f-surname", "f-year", "f-school"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener(el.tagName === "SELECT" ? "change" : "blur", checkForResumableDraft);
  });

  const btnIdk = document.getElementById("btn-idk");
  if (btnIdk) {
    btnIdk.addEventListener("click", () => {
      const q = QUESTIONS[state.qIndex];
      state.answers[q.id] = "IDK";
      state.qIndex++;
      state.selected = null;
      state.revealed = false;
      if (state.qIndex >= QUESTIONS.length) { state.phase = "writing"; stopQuizTimer(); }
      render();
    });
  }

  document.querySelectorAll(".opt-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      state.selected = btn.dataset.letter;
      render();
    });
  });

  const btnNext = document.getElementById("btn-next");
  if (btnNext) {
    btnNext.addEventListener("click", () => {
      const q = QUESTIONS[state.qIndex];
      state.answers[q.id] = state.selected;
      state.qIndex++;
      state.selected = null;
      state.revealed = false;
      if (state.qIndex >= QUESTIONS.length) { state.phase = "writing"; stopQuizTimer(); }
      render();
    });
  }

  const btnTeacher = document.getElementById("btn-teacher-mode");
  if (btnTeacher) {
    btnTeacher.addEventListener("click", function() {
      renderTeacherPin();
    });
  }
  const btnTeacherResults = document.getElementById("btn-teacher-mode-results");
  if (btnTeacherResults) {
    btnTeacherResults.addEventListener("click", function() {
      renderTeacherPin();
    });
  }
  const btnTeacherQuiz = document.getElementById("btn-teacher-mode-quiz");
  if (btnTeacherQuiz) {
    btnTeacherQuiz.addEventListener("click", function() {
      renderTeacherPin();
    });
  }
}


function submitResults() {
  stopDraftAutoSave();
  const elapsedMs = Date.now() - (state.startTime || Date.now());
  const mins = Math.floor(elapsedMs / 60000);
  const secs = Math.floor((elapsedMs % 60000) / 1000);
  const timeTaken = `${mins}m ${secs}s`;

  const payload = {
    name:        state.student.name,
    year:        state.student.year,
    school:      state.student.school,
    teacher:     state.student.teacher,
    date:        state.student.date,
    status:      state.student.status,
    className:   state.student.className,
    timestamp:   new Date().toISOString(),
    assessment:  "Ignite English Y3/4",
    timeTaken:   timeTaken,
    answers:     JSON.stringify(state.answers),
    writingSample: state.writingText || "",
  };

  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("PASTE_YOUR")) {
    const el = document.getElementById("submit-status");
    if (el) {
      el.className = "submit-status error";
      el.textContent = "⚠️ Results not sent — Apps Script URL not configured yet.";
    }
    return;
  }

  clearSavedState();
  fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify(payload),
  })
    .then(r => r.json())
    .then(result => {
      if (result.status !== "ok" && !result.success) throw new Error(result.message || result.error || "Server returned an error status");
      renderResultsScreen(result, timeTaken);
      // Cache locally too, so Teacher Mode works even if this device goes offline later
      saveResultsToStore({
        timestamp: payload.timestamp, name: state.student.name, year: state.student.year,
        school: state.student.school, teacher: state.student.teacher, date: state.student.date,
        total: result.total, rag: result.rag, placement: result.group, teacherNote: result.teacherNote,
        timeTaken: timeTaken, secScores: result.secScores, answers: state.answers, tutorComment: "",
        writingSample: state.writingText || "", aiWritingFeedback: "",
      });
    })
    .catch(err => {
      console.error("Ignite English submission failed:", err); // visible in browser dev tools for diagnosis
      const el = document.getElementById("submit-status");
      if (el) {
        el.className = "submit-status error";
        el.innerHTML = "⚠️ Could not send results. Your answers are safely saved — please try again."
          + '<br><button id="btn-retry-submit" style="margin-top:8px;background:var(--brand);border:none;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer;color:white;">Try Again</button>';
        const retryBtn = document.getElementById("btn-retry-submit");
        if (retryBtn) retryBtn.addEventListener("click", () => { state.submitted = false; render(); });
      }
    });
}

// ── INIT ─────────────────────────────────────────────────────────────────────
// Check for saved state on page load
function init() {
  const saved = loadSavedState();
  render(); // render cover first
  if (saved) {
    // Show resume banner
    const banner = document.getElementById("resume-banner");
    if (banner) banner.style.display = "block";

    const btnResume = document.getElementById("btn-resume");
    if (btnResume) {
      btnResume.addEventListener("click", function() {
        state.phase     = saved.phase;
        state.student   = saved.student;
        state.qIndex    = saved.qIndex;
        state.answers   = saved.answers;
        state.selected  = saved.selected;
        state.revealed  = saved.revealed;
        state.startTime = saved.startTime || Date.now();
        render();
        if (state.phase === "quiz") startQuizTimer();
      });
    }
    const btnFresh = document.getElementById("btn-fresh");
    if (btnFresh) {
      btnFresh.addEventListener("click", function() {
        clearSavedState();
        const banner = document.getElementById("resume-banner");
        if (banner) banner.style.display = "none";
      });
    }
  }

}

// ── CLASS DROPDOWN (self-managed, same pattern as every other paper) ────────
function loadClasses() {
  const sel = document.getElementById("f-class");
  if (!sel) return;
  const fallback = ["Other"];
  function populate(names) {
    sel.innerHTML = "";
    names.forEach(name => { const opt = document.createElement("option"); opt.value = name; opt.textContent = name; sel.appendChild(opt); });
    onClassSelectChange();
  }
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("PASTE_YOUR")) { populate(fallback); return; }
  fetch(APPS_SCRIPT_URL + "?action=getClasses")
    .then(r => r.json())
    .then(data => populate(data.classes && data.classes.length ? data.classes : fallback))
    .catch(() => populate(fallback));
}
function loadTutors() {
  populateTutorSelect();
}
function onClassSelectChange() {
  const sel = document.getElementById("f-class");
  const other = document.getElementById("f-class-other");
  if (!sel || !other) return;
  other.style.display = (sel.value === "Other") ? "block" : "none";
}
function resolveSelectedClass() {
  const sel = document.getElementById("f-class");
  if (!sel) return "";
  if (sel.value === "Other") {
    const typed = document.getElementById("f-class-other").value.trim();
    return typed || "Other";
  }
  return sel.value;
}

// ── SERVER-SIDE DRAFT AUTO-SAVE & RESUME (cross-device, separate from the
// local-only saveState/loadSavedState mechanism above) ─────────────────────
let draftAutoSaveInterval = null;
const DRAFT_AUTOSAVE_MS = 20000;

function startDraftAutoSave() {
  if (draftAutoSaveInterval) clearInterval(draftAutoSaveInterval);
  draftAutoSaveInterval = setInterval(() => {
    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("PASTE_YOUR") || !state.student) return;
    fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({
        action: "saveDraft",
        name: state.student.name, year: state.student.year, school: state.student.school,
        teacher: state.student.teacher, status: state.student.status, className: state.student.className,
        startTimestamp: state.startTimestamp,
        answers: JSON.stringify(state.answers)
      })
    }).catch(() => {});
  }, DRAFT_AUTOSAVE_MS);
}
function stopDraftAutoSave() {
  if (draftAutoSaveInterval) { clearInterval(draftAutoSaveInterval); draftAutoSaveInterval = null; }
}

function checkForResumableDraft() {
  const name = document.getElementById("f-name").value.trim();
  const surname = document.getElementById("f-surname").value.trim();
  const fullName = name + (surname ? " " + surname : "");
  const year = document.getElementById("f-year").value;
  const school = document.getElementById("f-school").value.trim();
  if (!name || !year || !school || !APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("PASTE_YOUR")) return;
  fetch(APPS_SCRIPT_URL + "?action=getDraft&name=" + encodeURIComponent(fullName) + "&year=" + encodeURIComponent(year) + "&school=" + encodeURIComponent(school))
    .then(r => r.json())
    .then(draft => {
      const banner = document.getElementById("server-resume-banner");
      if (!banner) return;
      if (draft && draft.name) {
        banner.style.display = "block";
        banner.innerHTML = `An in-progress attempt was found (${draft.answeredCount || 0} questions answered, last saved ${new Date(draft.lastSaved).toLocaleString()}).
          <button id="btn-resume-server-draft" type="button" style="margin-left:8px;">Resume</button>
          <button id="btn-fresh-start-server" type="button" style="margin-left:4px;">Start Fresh</button>`;
        document.getElementById("btn-resume-server-draft").addEventListener("click", () => resumeServerDraft(fullName, year, school, draft));
        document.getElementById("btn-fresh-start-server").addEventListener("click", () => { banner.style.display = "none"; });
      } else {
        banner.style.display = "none";
      }
    }).catch(() => {});
}

function resumeServerDraft(fullName, year, school, draft) {
  state.student = {
    name: fullName, year, school, teacher: draft.teacher,
    date: new Date().toISOString().slice(0,10),
    academicYear: getAcademicYear(new Date().toISOString().slice(0,10)), term: getTerm(new Date()),
    status: draft.status, className: draft.className
  };
  state.startTime = Date.now() - (Date.now() - new Date(draft.startTimestamp).getTime());
  state.startTimestamp = draft.startTimestamp;
  try { state.answers = JSON.parse(draft.answers || "{}"); } catch(e) { state.answers = {}; }
  state.qIndex = Object.keys(state.answers).length;
  state.phase = "quiz";
  render();
  startQuizTimer();
  startDraftAutoSave();
}

// ── DEEP LINK from the submission email ──────────────────────────────────────
function getDeepLinkParams() {
  const params = new URLSearchParams(window.location.search);
  if (params.get("view") !== "student") return null;
  return {
    name: params.get("name") || "", year: params.get("year") || "",
    school: params.get("school") || "", teacher: params.get("teacher") || "",
    timestamp: params.get("timestamp") || ""
  };
}
const pendingDeepLink = getDeepLinkParams();

// ── LIVE MONITOR — see who's currently mid-test, polling every 12s ─────────
let liveMonitorInterval = null;
const LIVE_MONITOR_POLL_MS = 12000;

function renderLiveMonitor() {
  const app = document.getElementById("app");
  app.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <div style="font-size:20px;font-weight:900;color:var(--brand-dark);flex:1">📡 Live Monitor</div>
      <button id="btn-lm-back" style="background:none;border:2px solid var(--grey-mid);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text-soft);">✕ Close</button>
    </div>
    <div id="lm-content"><p style="color:var(--text-soft)">Loading...</p></div>
  `;
  document.getElementById("btn-lm-back").addEventListener("click", () => {
    if (liveMonitorInterval) { clearInterval(liveMonitorInterval); liveMonitorInterval = null; }
    renderTeacherDashboard();
  });
  pollLiveMonitor();
  if (liveMonitorInterval) clearInterval(liveMonitorInterval);
  liveMonitorInterval = setInterval(pollLiveMonitor, LIVE_MONITOR_POLL_MS);
}

function pollLiveMonitor() {
  const el = document.getElementById("lm-content");
  if (!el) return;
  fetch(APPS_SCRIPT_URL + "?action=getActiveDrafts&pin=" + encodeURIComponent(TEACHER_PIN))
    .then(r => r.json())
    .then(drafts => {
      const el2 = document.getElementById("lm-content");
      if (!el2) return;
      if (drafts.error) { el2.innerHTML = `<p style="color:var(--red-c)">${drafts.error}</p>`; return; }
      if (!drafts.length) { el2.innerHTML = `<p style="color:var(--text-soft)">No students currently mid-test.</p>`; return; }
      el2.innerHTML = drafts.map(d => `
        <div style="background:white;border:2px solid var(--grey-mid);border-radius:10px;padding:12px 14px;margin-bottom:8px">
          <div style="font-weight:700;color:var(--brand-dark)">${d.name} <span style="font-weight:400;color:var(--text-soft);font-size:12px">(${d.year || ""}${d.className ? " — " + d.className : ""})</span></div>
          <div style="font-size:12px;color:var(--text-soft);margin-top:2px">
            Started ${new Date(d.startTimestamp).toLocaleTimeString()} · ${d.answeredCount || 0}/37 answered · last saved ${Math.round((Date.now() - new Date(d.lastSaved).getTime())/1000)}s ago
          </div>
        </div>
      `).join("");
    })
    .catch(() => {
      const el3 = document.getElementById("lm-content");
      if (el3) el3.innerHTML = `<p style="color:var(--red-c)">Could not load. Check your connection.</p>`;
    });
}

// ── QUESTION WALKTHROUGH — go through the blank paper, reveal answers on demand ──
let walkthroughRevealed = {};

function renderWalkthrough(idx) {
  const app = document.getElementById("app");
  if (!teacherAnswerKey || Object.keys(teacherAnswerKey).length === 0) {
    app.innerHTML = `<p style="color:var(--text-soft)">Loading answer key...</p>`;
    loadTeacherAnswerKey().then(() => renderWalkthrough(idx));
    return;
  }

  const q = QUESTIONS[idx];
  const letters = ["A", "B", "C", "D"];
  const revealed = !!walkthroughRevealed[q.id];
  const correctLetter = teacherAnswerKey[q.id];

  const optsHtml = q.opts.map((opt, i) => {
    const letter = letters[i];
    const isCorrect = revealed && letter === correctLetter;
    return `<div style="padding:10px 14px;border:2px solid ${isCorrect ? "var(--green)" : "var(--grey-mid)"};border-radius:8px;margin-bottom:6px;background:${isCorrect ? "var(--green-light)" : "white"};font-weight:${isCorrect ? "700" : "400"}">${opt}</div>`;
  }).join("");

  app.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <div style="font-size:20px;font-weight:900;color:var(--brand-dark);flex:1">📖 Walkthrough — Q${idx + 1} of ${QUESTIONS.length}</div>
      <button id="btn-wt-back" style="background:none;border:2px solid var(--grey-mid);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text-soft);">✕ Close</button>
    </div>
    <div style="background:white;border:2px solid var(--grey-mid);border-radius:12px;padding:18px">
      <div style="font-size:16px;margin-bottom:14px">${q.text}${q.display && typeof q.display === "string" ? "<div class='q-display' style='margin-top:10px'>" + q.display + "</div>" : ""}</div>
      ${optsHtml}
      ${revealed ? "" : `<button id="btn-wt-reveal" style="margin-top:10px;background:var(--brand);color:white;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;">Reveal Answer</button>`}
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:16px">
      <button id="btn-wt-prev" ${idx === 0 ? "disabled" : ""} style="background:none;border:2px solid var(--grey-mid);border-radius:8px;padding:8px 16px;font-weight:600;cursor:pointer;">← Previous</button>
      <button id="btn-wt-next" ${idx === QUESTIONS.length - 1 ? "disabled" : ""} style="background:none;border:2px solid var(--grey-mid);border-radius:8px;padding:8px 16px;font-weight:600;cursor:pointer;">Next →</button>
    </div>
  `;

  document.getElementById("btn-wt-back").addEventListener("click", () => renderTeacherDashboard());
  document.getElementById("btn-wt-prev").addEventListener("click", () => { if (idx > 0) renderWalkthrough(idx - 1); });
  document.getElementById("btn-wt-next").addEventListener("click", () => { if (idx < QUESTIONS.length - 1) renderWalkthrough(idx + 1); });
  const revealBtn = document.getElementById("btn-wt-reveal");
  if (revealBtn) revealBtn.addEventListener("click", () => { walkthroughRevealed[q.id] = true; renderWalkthrough(idx); });
}

init();
if (pendingDeepLink) {
  const btnTeacherMode = document.getElementById("btn-teacher-mode");
  if (btnTeacherMode) btnTeacherMode.click();
}
</script>
