<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aim High Tuition — Master English Baseline</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --brand:      #4C1D95;
    --brand-dark: #2E1065;
    --gold:       #C8860A;
    --gold-light: #FFF8E7;
    --gold-mid:   #FFE9A0;
    --green:      #1B5E20;
    --green-light:#E8F5E9;
    --amber:      #E65100;
    --amber-light:#FFF3E0;
    --red-c:      #B71C1C;
    --red-light:  #FFEBEE;
    --grey-light: #F5F5F5;
    --grey-mid:   #E0E0E0;
    --text:       #1A1A1A;
    --text-soft:  #555;
    --white:      #FFFFFF;
    --radius:     12px;
    --shadow:     0 4px 20px rgba(0,0,0,0.10);
  }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--gold-light);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── HEADER ── */
  header {
    width: 100%;
    background: var(--brand);
    color: white;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-star { font-size: 28px; }
  .logo-text { font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
  .logo-sub  { font-size: 11px; opacity: 0.8; }

  /* ── MAIN CARD ── */
  .card {
    background: white;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 32px 28px;
    width: 100%;
    max-width: 640px;
    margin: 24px 16px;
  }

  /* ── PROGRESS BAR ── */
  .progress-wrap {
    background: var(--grey-mid);
    border-radius: 99px;
    height: 10px;
    margin-bottom: 6px;
    overflow: hidden;
  }
  .progress-bar {
    background: linear-gradient(90deg, var(--brand), var(--gold));
    height: 100%;
    border-radius: 99px;
    transition: width 0.4s ease;
  }
  .progress-label {
    font-size: 12px;
    color: var(--text-soft);
    text-align: right;
    margin-bottom: 20px;
  }

  /* ── SECTION BADGE ── */
  .section-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--brand);
    color: white;
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 16px;
    text-transform: uppercase;
  }

  /* ── QUESTION ── */
  .q-number {
    font-size: 13px;
    color: var(--text-soft);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .q-text {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.35;
    margin-bottom: 8px;
    color: var(--text);
  }
  .q-hint {
    font-size: 14px;
    color: var(--brand);
    background: var(--gold-light);
    border-left: 3px solid var(--gold);
    padding: 8px 12px;
    border-radius: 6px;
    margin-bottom: 20px;
    font-style: italic;
  }
  .q-display {
    font-size: 42px;
    font-weight: 900;
    color: var(--brand-dark);
    text-align: center;
    margin: 12px 0 24px;
    background: var(--gold-light);
    border-radius: 12px;
    padding: 16px;
    letter-spacing: 1px;
  }

  /* ── OPTIONS ── */
  .options {
    display: grid;
    gap: 12px;
    margin-bottom: 24px;
  }
  .options.two-col   { grid-template-columns: 1fr 1fr; }
  .options.three-col { grid-template-columns: 1fr 1fr 1fr; }
  .options.four-col  { grid-template-columns: 1fr 1fr; }

  .opt-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border: 2px solid var(--grey-mid);
    border-radius: 10px;
    background: var(--grey-light);
    cursor: pointer;
    font-size: 16px;
    font-weight: 500;
    text-align: left;
    transition: all 0.15s;
    color: var(--text);
    width: 100%;
  }
  .opt-btn:hover { border-color: var(--brand); background: var(--gold-light); }
  .opt-btn.selected {
    border-color: var(--brand);
    background: var(--gold-mid);
    font-weight: 700;
  }
  .opt-btn.correct {
    border-color: var(--green);
    background: var(--green-light);
    color: var(--green);
  }
  .opt-btn.wrong {
    border-color: var(--red-c);
    background: var(--red-light);
    color: var(--red-c);
    text-decoration: line-through;
    opacity: 0.8;
  }
  .opt-letter {
    width: 32px;
    height: 32px;
    min-width: 32px;
    border-radius: 6px;
    background: var(--brand);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 14px;
  }
  .opt-btn.correct .opt-letter { background: var(--green); }
  .opt-btn.wrong   .opt-letter { background: var(--red-c); }

  /* ── I DON'T KNOW BUTTON ── */
  .btn-speak {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--gold-light);
    border: 2px solid var(--gold);
    color: var(--brand-dark);
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 16px;
  }
  .btn-speak:hover { background: var(--gold-mid); }
  .btn-speak:active { transform: scale(0.97); }

  .btn-idk {
    width: 100%;
    padding: 11px;
    background: white;
    color: var(--text-soft);
    border: 2px dashed var(--grey-mid);
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 14px;
    transition: all 0.15s;
  }
  .btn-idk:hover { border-color: var(--text-soft); color: var(--text); }

  /* ── NEXT BUTTON ── */
  .btn-next {
    width: 100%;
    padding: 16px;
    background: var(--brand);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-next:hover { background: var(--brand-dark); }
  .btn-next:disabled { background: var(--grey-mid); color: var(--text-soft); cursor: not-allowed; }

  /* ── CHECKPOINT ── */
  .checkpoint {
    background: var(--gold-mid);
    border: 2px solid var(--gold);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 20px;
    text-align: center;
    font-size: 16px;
    font-weight: 700;
    color: var(--brand-dark);
  }
  .checkpoint .emoji { font-size: 28px; display: block; margin-bottom: 6px; }

  /* ── COVER PAGE ── */
  .cover-title {
    font-size: 28px;
    font-weight: 900;
    color: var(--brand-dark);
    margin-bottom: 6px;
  }
  .cover-sub {
    font-size: 15px;
    color: var(--text-soft);
    margin-bottom: 24px;
  }
  .instr-box {
    background: var(--gold-light);
    border: 2px solid var(--gold);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 24px;
  }
  .instr-box h3 {
    color: var(--brand-dark);
    font-size: 14px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }
  .instr-box li {
    font-size: 14px;
    color: var(--text);
    margin-bottom: 6px;
    margin-left: 16px;
  }
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group label { font-size: 13px; font-weight: 600; color: var(--text-soft); }
  .form-group input, .form-group select {
    padding: 10px 12px;
    border: 2px solid var(--grey-mid);
    border-radius: 8px;
    font-size: 15px;
    color: var(--text);
    background: white;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus, .form-group select:focus { border-color: var(--brand); }

  /* ── RESULTS PAGE ── */
  .result-hero {
    text-align: center;
    padding: 24px 0 16px;
  }
  .result-emoji { font-size: 64px; line-height: 1; margin-bottom: 12px; }
  .result-score {
    font-size: 52px;
    font-weight: 900;
    line-height: 1;
    margin-bottom: 4px;
  }
  .result-score.green { color: var(--green); }
  .result-score.amber { color: var(--amber); }
  .result-score.red-c { color: var(--red-c); }
  .rag-pill {
    display: inline-block;
    padding: 6px 20px;
    border-radius: 99px;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .rag-pill.green { background: var(--green-light); color: var(--green); }
  .rag-pill.amber { background: var(--amber-light); color: var(--amber); }
  .rag-pill.red-c { background: var(--red-light);   color: var(--red-c); }
  .placement-box {
    background: var(--brand);
    color: white;
    border-radius: 12px;
    padding: 16px 20px;
    margin: 16px 0;
    text-align: center;
  }
  .placement-box .label { font-size: 12px; opacity: 0.8; margin-bottom: 4px; }
  .placement-box .value { font-size: 22px; font-weight: 900; }

  .section-breakdown {
    margin-top: 20px;
  }
  .section-breakdown h3 {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-soft);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }
  .sec-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .sec-letter {
    width: 30px;
    height: 30px;
    min-width: 30px;
    border-radius: 6px;
    background: var(--brand);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 13px;
  }
  .sec-info { flex: 1; }
  .sec-name { font-size: 13px; font-weight: 600; }
  .sec-bar-wrap { height: 8px; background: var(--grey-mid); border-radius: 99px; margin-top: 4px; overflow: hidden; }
  .sec-bar { height: 100%; border-radius: 99px; transition: width 0.6s ease; }
  .sec-bar.green { background: var(--green); }
  .sec-bar.amber { background: var(--amber); }
  .sec-bar.red-c { background: var(--red-c); }
  .sec-score { font-size: 13px; font-weight: 700; min-width: 36px; text-align: right; }

  .summary-box {
    background: var(--grey-light);
    border-radius: 10px;
    padding: 16px;
    margin-top: 16px;
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
  }

  .submit-status {
    margin-top: 16px;
    padding: 12px;
    border-radius: 8px;
    font-size: 13px;
    text-align: center;
    font-weight: 600;
  }
  .submit-status.sending { background: var(--gold-light); color: var(--brand); }
  .submit-status.sent    { background: var(--green-light); color: var(--green); }
  .submit-status.error   { background: var(--red-light);   color: var(--red-c); }

  .frac {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    vertical-align: middle;
    margin: 0 3px;
    font-size: 0.9em;
    line-height: 1.1;
    position: relative;
    top: 0.05em;
  }
  .frac .num { padding: 0 4px 2px; border-bottom: 1.5px solid currentColor; }
  .frac .den { padding: 2px 4px 0; }

  @media (max-width: 480px) {
    .card { padding: 20px 16px; margin: 12px 10px; }
    .q-text { font-size: 18px; }
    .q-display { font-size: 32px; }
    .form-row { grid-template-columns: 1fr; }
    .options.two-col { grid-template-columns: 1fr; }
    .options.three-col { grid-template-columns: 1fr; }
  }
</style>
</head>

// ── PLACEMENT LOGIC ──────────────────────────────────────────────────────────
// True if the pupil's year group is BELOW this baseline's target range (e.g.
// a rising Year 5 currently finishing Year 4, tested ahead of their cohort).
// Used to stop the placement logic recommending a downgrade to a lower
// baseline purely because a younger pupil hasn't been taught Y5/6-only
// content yet — that's developmentally expected, not a sign of falling behind.
// Placement is computed server-side now (see Master_English_Code.gs) —
// the client no longer computes total/section scores/RAG/placement
// itself, it only renders whatever the server returns after marking.
// (BASELINE_TARGET_YEARS and getYearMismatchNote below stay client-side —
// they're pure display helpers, independent of scoring.)

function getSectionRag(score, max) {
  const pct = score / max;
  if (pct >= 0.8) return "green";
  if (pct >= 0.5) return "amber";
  return "red-c";
}

// Plain-English "expected standard" labels for teachers/parents, mapped from
// the existing RAG logic (GREEN/AMBER/RED already represent Above/At/Below).
function getStandardLabel(rag) {
  if (rag === "GREEN") return "Working Above Expected Standard";
  if (rag === "AMBER") return "Working At Expected Standard";
  return "Working Below Expected Standard";
}
function getSectionStandardLabel(cls) {
  if (cls === "green") return "Above Expected";
  if (cls === "amber") return "At Expected";
  return "Below Expected";
}

// This baseline's designed target year group — used to flag when a child's
// entered Year doesn't match, since the Expected Standard label only means
// what it says when the content matches the child's actual year group.
const BASELINE_TARGET_YEARS = ["Year 5", "Year 6"];
function getYearMismatchNote(year) {
  if (!year) return "";
  const targetNums = BASELINE_TARGET_YEARS.map(y => parseInt(y.match(/\d+/)[0]));
  const minTarget = Math.min(...targetNums), maxTarget = Math.max(...targetNums);
  const m = year.match(/\d+/);
  const yearNum = year === "Reception" ? 0 : (m ? parseInt(m[0]) : null);
  if (yearNum === null) return ""; // "Other" or unrecognised — can't compare
  if (yearNum < minTarget) {
    return `⚠️ ${year} tested on a ${BASELINE_TARGET_YEARS.join('/')} baseline — this reflects performance on content above their normal year group, not their standing within ${year}.`;
  }
  if (yearNum > maxTarget) {
    return `⚠️ ${year} tested on a ${BASELINE_TARGET_YEARS.join('/')} baseline — this reflects performance on content below their normal year group, not their standing within ${year}.`;
  }
  return "";
}

// ── ACADEMIC YEAR / TERM — auto-derived from the sitting date, UK school-year cycle ──
function getAcademicYear(dateStr) {
  const d = dateStr ? new Date(dateStr) : new Date();
  if (isNaN(d)) return "";
  const y = d.getFullYear(), m = d.getMonth() + 1; // 1-12
  return (m >= 9) ? `${y}/${String(y + 1).slice(-2)}` : `${y - 1}/${String(y).slice(-2)}`;
}
function getTerm(dateStr) {
  const d = dateStr ? new Date(dateStr) : new Date();
  if (isNaN(d)) return "";
  const m = d.getMonth() + 1;
  if (m >= 9) return "Autumn";
  if (m <= 4) return "Spring";
  return "Summer";
}

// Normalizes any academic-year string to the "YYYY/YY" format, so older
// rows saved with the previous hyphen format ("2025-26", from before this
// was fixed) are treated as identical to new slash-formatted rows.
function normalizeAcademicYear(val) {
  if (!val) return val;
  const m = String(val).match(/^(\d{4})[\/-](\d{2})$/);
  return m ? `${m[1]}/${m[2]}` : val;
}

function saveResultsToStore(studentData) {
  try {
    const all = getStoredResults();
    all.unshift(studentData); // newest first
    if (all.length > 50) all.splice(50);
    localStorage.setItem(RESULTS_STORE_KEY, JSON.stringify(all));
  } catch(e) {}
}

// Updates an already-cached local entry in place (matched by timestamp) —
// used to fill in the server-computed score once a pending submission
// succeeds, without creating a second duplicate entry.
function updateStoredResult(timestamp, updates) {
  try {
    const all = getStoredResults();
    const idx = all.findIndex(r => String(r.timestamp) === String(timestamp));
    if (idx === -1) return;
    Object.assign(all[idx], updates);
    localStorage.setItem(RESULTS_STORE_KEY, JSON.stringify(all));
  } catch(e) {}
}

function getStoredResults() {
  try {
    const raw = localStorage.getItem(RESULTS_STORE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e) { return []; }
}

// Compares this device's local results against the synced list from the
// Sheet, by timestamp, and returns any that only exist locally — e.g. a
// submission made during a wifi dropout that never actually reached Google.
function findUnsyncedLocalResults() {
  try {
    const local = getStoredResults();
    const remoteTimestamps = new Set(teacherResultsCache.map(r => String(r.timestamp)));
    return local.filter(r => r.timestamp && !remoteTimestamps.has(String(r.timestamp)));
  } catch(e) { return []; }
}

// Rebuilds a full submission payload from a locally-saved result and POSTs
// it, same as a normal live submission — lets a result recover from a failed
// sync without the pupil having to retake the whole assessment.
function syncPendingResults() {
  const statusEl = document.getElementById("sync-pending-status");
  const btnEl = document.getElementById("btn-sync-pending");
  const pending = findUnsyncedLocalResults();
  if (!pending.length) return;

  btnEl.disabled = true;
  statusEl.textContent = "Syncing...";

  // Resend the RAW ANSWERS, exactly like a normal live submission — the
  // server scores it fresh via its own answer key, rather than trusting
  // whatever total/rag/placement happened to be cached locally (which for
  // a genuinely-never-synced entry won't exist yet anyway).
  const requests = pending.map(r => fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({
      name: r.name, year: r.year, school: r.school, teacher: r.teacher,
      date: r.date, status: r.studentStatus, className: r.className,
      timestamp: r.timestamp, assessment: "Master English",
      timeTaken: r.timeTaken,
      answers: JSON.stringify(r.answers || {}),
      writingSample: r.writingSample || "",
    }),
  }).then(res => res.json()));

  Promise.all(requests).then(results => {
    results.forEach((result, i) => {
      if (result.status === "ok") {
        updateStoredResult(pending[i].timestamp, {
          total: result.total, rag: result.rag, placement: result.group,
          teacherNote: result.teacherNote, secScores: result.secScores,
        });
      }
    });
    statusEl.textContent = "✅ Synced — refreshing...";
    setTimeout(() => {
      teacherResultsCache = null;
      fetchRemoteResults().then(remote => {
        teacherResultsCache = remote;
        renderTeacherDashboard();
      });
    }, 800);
  }).catch(() => {
    btnEl.disabled = false;
    statusEl.textContent = "⚠️ Still couldn't reach the Sheet — try again shortly.";
  });
}

// Builds one tab-separated row matching the exact 65-column header order in
// the Results sheet, so it can be pasted directly into Google Sheets — this
// bypasses the network/fetch entirely, as a guaranteed-to-work fallback when
// a device genuinely can't reach the Apps Script endpoint for any reason.
// Requires Teacher Mode's PIN-gated teacherAnswerKey to score a pending
// (never-synced) entry that doesn't have a server-confirmed total yet.
function buildSpreadsheetRow(r) {
  const sc = r.secScores || {};
  const answers = r.answers || {};

  // For a genuinely pending entry (never reached the server, so total is
  // null), compute the real total from the raw answers using the PIN-gated
  // teacherAnswerKey — but RAG/placement can't be recreated client-side
  // (that logic lives server-side only now), so it's marked pending rather
  // than showing a misleading value. Retrying the sync is the reliable path;
  // this manual-paste route is the last-resort fallback.
  let total = r.total;
  let isPending = (total === null || total === undefined);
  if (isPending) {
    total = 0;
    for (let i = 1; i <= 38; i++) {
      if (answers[i] && answers[i] === teacherAnswerKey[i]) total++;
    }
  }
  const rag = isPending ? "PENDING — retry sync for RAG" : (r.rag || "");
  const placement = isPending ? "PENDING — retry sync for placement" : (r.placement || "");
  const teacherNote = isPending ? "Score shown is calculated from raw answers; RAG/placement require a successful sync." : (r.teacherNote || "");

  const cols = [
    r.timestamp || "", r.date || "", r.name || "", r.year || "", r.school || "",
    r.teacher || "", "Master English", r.academicYear || "", r.term || "", r.studentStatus || "",
    total, rag, placement, teacherNote,
    sc.A||0, sc.B||0, sc.C||0, sc.D||0, sc.E||0, sc.F||0, sc.G||0, sc.H||0,
  ];
  for (let i = 1; i <= 38; i++) {
    const q = QUESTIONS.find(qq => qq.id === i);
    const given = answers[i];
    cols.push((q && given === teacherAnswerKey[q.id]) ? 1 : 0);
  }
  cols.push(r.timeTaken || "");
  cols.push(isPending
    ? `${r.name} — pending sync, score calculated locally from raw answers (${total}/38). RAG/placement require a successful sync to the server.`
    : `${r.name} scored ${r.total}/38 on the Master English Baseline. PLACEMENT: ${r.placement}. ${r.teacherNote} (recovered via manual copy after a sync issue.)`);
  cols.push(JSON.stringify(answers));
  cols.push(""); // Tutor Comments
  cols.push(r.writingSample || "");
  cols.push(r.aiWritingFeedback || "");
  return cols.join("\t");
}

function copyTextToClipboard(text, statusEl, successMsg) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      if (statusEl) { statusEl.textContent = successMsg; statusEl.style.color = "#166534"; }
    }).catch(() => {
      if (statusEl) { statusEl.textContent = "⚠️ Could not copy — try selecting and copying manually."; statusEl.style.color = "#B91C1C"; }
    });
  } else if (statusEl) {
    statusEl.textContent = "⚠️ Clipboard not available on this browser.";
    statusEl.style.color = "#B91C1C";
  }
}

function copyPendingAsRows() {

function formatDateNice(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
}

// Matches header by PREFIX ("Sec A ") rather than the full exact string
// ("Sec A (6)") — immune to a sheet header still showing an old bracketed
// max after a future difficulty-calibration pass changes a section's size.
function getSecScoreByPrefixMaster(row, letter) {
  const prefix = "Sec " + letter + " ";
  const key = Object.keys(row).find(k => k.indexOf(prefix) === 0);
  return key ? (Number(row[key]) || 0) : 0;
}

function normalizeRemoteResult(row) {
  // Prefer the raw "Answers JSON" column (exact letters the student picked)
  // for full per-question review. Falls back to correctness-only reconstruction
  // for any older rows submitted before this column existed.
  let answers = null;
  if (row["Answers JSON"]) {
    try { answers = JSON.parse(row["Answers JSON"]); } catch(e) { answers = null; }
  }
  if (!answers) {
    answers = {};
    QUESTIONS.forEach(q => {
      const isCorrect = Number(row["Q" + q.id]) === 1;
      answers[q.id] = isCorrect ? teacherAnswerKey[q.id] : "✗";
    });
  }

  return {
    timestamp:   row["Timestamp"],
    name:        row["Name"],
    year:        row["Year"],
    school:      row["School"],
    teacher:     row["Teacher"],
    date:        row["Date"],
    academicYear: normalizeAcademicYear(row["Academic Year"]),
    term:         row["Term"],
    studentStatus: row["Student Status"],
    className:   row["Class"] || "",
    total:       Number(row["Total"]) || 0,
    rag:         row["RAG"],
    placement:   row["Group Placed"],
    teacherNote: row["Teacher Action Note"],
    timeTaken:   row["Time Taken"],
    tutorComment: row["Tutor Comments"] || "",
    writingSample: row["Writing Sample"] || "",
    aiWritingFeedback: row["AI Writing Feedback"] || "",
    secScores: {
      A: getSecScoreByPrefixMaster(row, "A"),
      B: getSecScoreByPrefixMaster(row, "B"),
      C: getSecScoreByPrefixMaster(row, "C"),
      D: getSecScoreByPrefixMaster(row, "D"),
      E: getSecScoreByPrefixMaster(row, "E"),
      F: getSecScoreByPrefixMaster(row, "F"),
      G: getSecScoreByPrefixMaster(row, "G"),
      H: getSecScoreByPrefixMaster(row, "H"),
    },
    answers: answers,
  };
}

function saveTutorComment(r) {
  const statusEl = document.getElementById("comment-save-status");
  const comment = document.getElementById("tutor-comment-box").value;

  if (!r.timestamp) {
    statusEl.textContent = "⚠️ Can't save — this result predates comment support.";
    statusEl.style.color = "var(--red-c)";
    return;
  }
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("PASTE_YOUR")) {
    statusEl.textContent = "⚠️ Apps Script URL not configured.";
    statusEl.style.color = "var(--red-c)";
    return;
  }

  statusEl.textContent = "Saving...";
  statusEl.style.color = "var(--text-soft)";

  fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({ action: "addComment", timestamp: r.timestamp, comment: comment }),
  })
    .then(res => res.json())
    .then(res => {
      if (res.status === "ok") {
        r.tutorComment = comment;
        // Reflect the change in whichever cache this result came from
        if (teacherResultsCache) {
          const match = teacherResultsCache.find(x => x.timestamp === r.timestamp);
          if (match) match.tutorComment = comment;
        }
        const local = getStoredResults();
        const localMatch = local.find(x => x.timestamp === r.timestamp);
        if (localMatch) {
          localMatch.tutorComment = comment;
          localStorage.setItem(RESULTS_STORE_KEY, JSON.stringify(local));
        }
        statusEl.textContent = "✅ Saved";
        statusEl.style.color = "#166534";
      } else {
        statusEl.textContent = "⚠️ Could not save — " + (res.message || "unknown error");
        statusEl.style.color = "var(--red-c)";
      }
    })
    .catch(() => {
      statusEl.textContent = "⚠️ Could not reach Google Sheet.";
      statusEl.style.color = "var(--red-c)";
    });
}

// Fires ONLY when the teacher clicks the button — never automatically on
// submission. Sends the writing sample to the Apps Script backend, which
// calls the Anthropic API server-side (API key never touches this HTML file)
// and returns/persists rubric feedback.
function analyzeWritingSample(r, btnEl) {
  const statusEl = document.getElementById("writing-analyze-status");
  const feedbackBlock = document.getElementById("writing-feedback-block");

  if (!r.timestamp) {
    statusEl.textContent = "⚠️ Can't analyse — missing timestamp for this result.";
    statusEl.style.color = "var(--red-c)";
    return;
  }
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("PASTE_YOUR")) {
    statusEl.textContent = "⚠️ Apps Script URL not configured.";
    statusEl.style.color = "var(--red-c)";
    return;
  }

  btnEl.disabled = true;
  statusEl.textContent = "Analysing... (takes a few seconds)";
  statusEl.style.color = "var(--text-soft)";

  fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({ action: "analyzeWriting", timestamp: r.timestamp, writingText: r.writingSample }),
  })
    .then(res => res.json())
    .then(res => {
      btnEl.disabled = false;
      if (res.status === "ok" && res.feedback) {
        r.aiWritingFeedback = JSON.stringify(res.feedback);
        if (teacherResultsCache) {
          const match = teacherResultsCache.find(x => x.timestamp === r.timestamp);
          if (match) match.aiWritingFeedback = r.aiWritingFeedback;
        }
        feedbackBlock.innerHTML = renderWritingFeedbackBlock(res.feedback);
        btnEl.textContent = "🤖 Re-analyse Writing (AI)";
        statusEl.textContent = "✅ Analysis complete";
        statusEl.style.color = "#166534";
      } else {
        statusEl.textContent = "⚠️ " + (res.message || "Could not analyse writing.");
        statusEl.style.color = "var(--red-c)";
      }
    })
    .catch(() => {
      btnEl.disabled = false;
      statusEl.textContent = "⚠️ Could not reach Google Sheet.";
      statusEl.style.color = "var(--red-c)";
    });
}

function renderTeacherLoading() {

function passesFilters(r) {
  if (dashboardFilters.search && !(r.name||"").toLowerCase().includes(dashboardFilters.search.toLowerCase())) return false;
  if (dashboardFilters.year && r.year !== dashboardFilters.year) return false;
  if (dashboardFilters.rag && r.rag !== dashboardFilters.rag) return false;
  if (dashboardFilters.teacher && r.teacher !== dashboardFilters.teacher) return false;
  if (dashboardFilters.className && r.className !== dashboardFilters.className) return false;
  if (dashboardFilters.academicYear && r.academicYear !== dashboardFilters.academicYear) return false;
  if (dashboardFilters.term && r.term !== dashboardFilters.term) return false;
  if (dashboardFilters.status && r.studentStatus !== dashboardFilters.status) return false;
  if (dashboardFilters.dateFrom) {
    const d = new Date(r.date);
    const from = new Date(dashboardFilters.dateFrom);
    if (isNaN(d) || d < from) return false;
  }
  if (dashboardFilters.dateTo) {
    const d = new Date(r.date);
    const to = new Date(dashboardFilters.dateTo);
    to.setHours(23,59,59,999);
    if (isNaN(d) || d > to) return false;
  }
  return true;
}

  `;

  if (filtered.length === 0) {
    html += `<div style="text-align:center;color:var(--text-soft);padding:32px 0;font-size:15px;">

  document.getElementById("td-filter-class").addEventListener("change", e => {
    dashboardFilters.className = e.target.value;
    renderTeacherDashboard();
  });
  document.getElementById("td-filter-ay").addEventListener("change", e => {

  document.getElementById("td-filter-term").addEventListener("change", e => {

    renderTeacherDashboard();
  });
  document.getElementById("td-filter-status").addEventListener("change", e => {
    dashboardFilters.status = e.target.value;
    renderTeacherDashboard();
  });
  document.getElementById("td-filter-from").addEventListener("change", e => {
    dashboardFilters.dateFrom = e.target.value;
    renderTeacherDashboard();

  document.getElementById("td-filter-to").addEventListener("change", e => {
    dashboardFilters.dateTo = e.target.value;
    renderTeacherDashboard();
  });
  const clearBtn = document.getElementById("td-clear-filters");
  if (clearBtn) {
    clearBtn.addEventListener("click", () => {

  }
  document.querySelectorAll(".student-card").forEach(card => {
    card.addEventListener("click", () => {
      const idx = parseInt(card.dataset.idx);
      renderTeacherStudentView(all[idx]);

}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function renderWritingFeedbackBlock(fb) {
  const areas = [
    { key:"ideas",      label:"Ideas & Content" },
    { key:"structure",  label:"Sentence Structure" },
    { key:"vocabulary", label:"Vocabulary" },
    { key:"spelling",   label:"Spelling & Punctuation" },
  ];
  let html = '<div style="margin-top:12px;border-top:1px solid #e2e8f0;padding-top:12px">';
  areas.forEach(a => {
    const d = fb[a.key];
    if (!d) return;
    html += `<div style="margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;font-size:13px">
        <span style="font-weight:700">${a.label}</span>
        <span style="font-weight:900;color:#4C1D95">${d.score}/4</span>
      </div>
      <div style="font-size:12px;color:#64748b">${escapeHtml(d.comment||'')}</div>
    </div>`;
  });
  if (fb.summary) {
    html += `<div style="margin-top:10px;background:#F3E8FF;border-radius:8px;padding:10px;font-size:13px;color:#1a1a1a">${escapeHtml(fb.summary)}</div>`;
  }
  html += '</div>';
  return html;
}

// Writing Task is deliberately NEVER scored automatically — this panel shows
// the raw text plus an on-demand "Analyse Writing" button. The AI call only
// fires when a teacher explicitly clicks it, keeping a human as the actual
// decision-maker (same principle as Tutor Comments).
function renderWritingSamplePanel(r) {
  const hasSample = r.writingSample && r.writingSample.trim().length > 0;
  if (!hasSample) {
    return `<div style="background:white;border:2px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:14px">
      <div style="font-weight:900;font-size:14px;margin-bottom:6px;color:#1a3a5c">✍️ Writing Task</div>
      <div style="font-size:12px;color:#94a3b8">No writing sample recorded for this sitting.</div>
    </div>`;
  }
  let existingFeedback = null;
  if (r.aiWritingFeedback) {
    try { existingFeedback = JSON.parse(r.aiWritingFeedback); } catch(e) {}
  }
  return `<div style="background:white;border:2px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:14px">
    <div style="font-weight:900;font-size:14px;margin-bottom:6px;color:#1a3a5c">✍️ Writing Task</div>

    <div id="writing-feedback-block">${existingFeedback ? renderWritingFeedbackBlock(existingFeedback) : ''}</div>

    ${r.teacherNote ? `<div style="background:#f8fafc;border-left:3px solid var(--brand);border-radius:6px;padding:10px 14px;margin-bottom:16px;font-size:13px;color:var(--text)">📝 ${r.teacherNote}</div>` : ''}

        <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:3px">

        </div>
        <div style="background:#f1f5f9;border-radius:6px;height:10px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${bc};border-radius:6px"></div>
        </div>
        <div style="font-size:10px;color:${bc};font-weight:700;margin-top:2px">${getSectionStandardLabel(cls)}</div>
      </div>`;
  });

  html += `</div>

    <div style="background:white;border:2px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:14px">
      <div style="font-weight:900;font-size:14px;margin-bottom:8px;color:#1a3a5c">💬 Tutor Comments</div>
      <div style="font-size:12px;color:#94a3b8;margin-bottom:10px">Personal observations from the session — shows on the parent report.</div>

      <div style="display:flex;align-items:center;gap:10px;margin-top:8px">
        <button id="btn-save-comment" style="background:var(--brand);border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;color:white;">💾 Save Comment</button>
        <span id="comment-save-status" style="font-size:12px;color:var(--text-soft);"></span>
      </div>
    </div>

    ${renderWritingSamplePanel(r)}

    <!-- Q by Q — clickable -->
    <div style="background:white;border:2px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:14px">
      <div style="font-weight:900;font-size:14px;margin-bottom:4px;color:#1a3a5c">Question by Question</div>
      <div style="font-size:12px;color:#94a3b8;margin-bottom:12px">Tap any question to review it in detail</div>
      <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap">
        <button class="btn-filter-sv" data-filter="all" style="padding:4px 12px;border-radius:20px;border:2px solid var(--brand-dark);background:var(--brand-dark);color:white;font-size:12px;font-weight:700;cursor:pointer">All</button>
        <button class="btn-filter-sv" data-filter="wrong" style="padding:4px 12px;border-radius:20px;border:2px solid #e2e8f0;background:white;color:#64748b;font-size:12px;font-weight:700;cursor:pointer">❌ Wrong</button>
        <button class="btn-filter-sv" data-filter="skipped" style="padding:4px 12px;border-radius:20px;border:2px solid #e2e8f0;background:white;color:#64748b;font-size:12px;font-weight:700;cursor:pointer">⬜ Skipped</button>
      </div>
  `;

  QUESTIONS.forEach((q, qi) => {
    const given   = r.answers ? r.answers[q.id] : null;
    const correct = given && given !== 'IDK' && given === teacherAnswerKey[q.id];
    const idk     = given === 'IDK';
    const icon    = correct ? '✅' : idk ? '⬜' : '❌';
    const bg      = correct ? '#f0fdf4' : idk ? '#f8fafc' : '#fef2f2';
    const border  = correct ? '#bbf7d0' : idk ? '#e2e8f0' : '#fca5a5';
    const givenTxt = given && given !== 'IDK'
      ? given : given === 'IDK' ? '?' : '–';

      <div class="btn-q-detail" data-qi="${qi}"
        style="background:${bg};border:1px solid ${border};border-radius:10px;

        <span style="font-weight:700;font-size:13px;flex:1">Q${q.id}. ${q.text.slice(0,65)}${q.text.length>65?'…':''}</span>
        <span style="font-size:12px;font-weight:700;color:#94a3b8;min-width:16px">${givenTxt}</span>
        <span style="color:#cbd5e1;font-size:16px">›</span>

  html += `</div>`;

  document.getElementById('btn-sv-back').addEventListener('click', () => renderTeacherDashboard());
  document.getElementById('btn-print-report').addEventListener('click', () => renderParentReport(r));

  document.querySelectorAll('.btn-filter-sv').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.btn-filter-sv').forEach(b => {
        b.style.background='white'; b.style.color='#64748b'; b.style.borderColor='#e2e8f0';
      });
      btn.style.background='var(--brand-dark)'; btn.style.color='white'; btn.style.borderColor='var(--brand-dark)';
      const filter = btn.dataset.filter;
      document.querySelectorAll('.btn-q-detail').forEach(card => {
        const qi  = parseInt(card.dataset.qi);
        const q   = QUESTIONS[qi];
        const given = r.answers ? r.answers[q.id] : null;
        const correct = given && given !== 'IDK' && given === teacherAnswerKey[q.id];
        const idk     = given === 'IDK' || !given;
        const show = filter==='all' || (filter==='wrong' && !correct && !idk) || (filter==='skipped' && idk);
        card.style.display = show ? 'flex' : 'none';
      });
    });
  });

  document.querySelectorAll('.btn-q-detail').forEach(card => {
    card.addEventListener('click', () => {
      renderQuestionDetail(r, parseInt(card.dataset.qi), 'all');
    });
  });
}

function renderQuestionDetail(r, qIndex, filter) {
  const q = QUESTIONS[qIndex];
  const given = r.answers ? r.answers[q.id] : null;
  const correct = given && given !== 'IDK' && given === teacherAnswerKey[q.id];
  const idk = given === 'IDK' || !given;
  const letters = ["A","B","C","D"];

  let html = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <button id="btn-qd-back" style="background:none;border:2px solid var(--grey-mid);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text-soft);">← Back</button>
      <div style="flex:1;font-size:16px;font-weight:900;color:var(--brand-dark)">${r.name} — Q${q.id}</div>
      <button id="btn-qd-prev" ${qIndex===0?'disabled':''} style="background:var(--brand-dark);border:none;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;color:white;${qIndex===0?'opacity:0.4;cursor:not-allowed;':''}">◀</button>
      <button id="btn-qd-next" ${qIndex===QUESTIONS.length-1?'disabled':''} style="background:var(--brand-dark);border:none;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;color:white;${qIndex===QUESTIONS.length-1?'opacity:0.4;cursor:not-allowed;':''}">▶</button>
    </div>

    <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap">
      <button class="btn-qd-filter" data-filter="all" style="padding:4px 12px;border-radius:20px;border:2px solid var(--brand-dark);background:${filter==='all'?'var(--brand-dark)':'white'};color:${filter==='all'?'white':'#64748b'};font-size:12px;font-weight:700;cursor:pointer">All questions</button>
      <button class="btn-qd-filter" data-filter="wrong" style="padding:4px 12px;border-radius:20px;border:2px solid #e2e8f0;background:${filter==='wrong'?'var(--brand-dark)':'white'};color:${filter==='wrong'?'white':'#64748b'};font-size:12px;font-weight:700;cursor:pointer">❌ Wrong only</button>
      <button class="btn-qd-filter" data-filter="skipped" style="padding:4px 12px;border-radius:20px;border:2px solid #e2e8f0;background:${filter==='skipped'?'var(--brand-dark)':'white'};color:${filter==='skipped'?'white':'#64748b'};font-size:12px;font-weight:700;cursor:pointer">⬜ Skipped only</button>
    </div>
    <div style="text-align:center;font-size:12px;color:#94a3b8;margin-bottom:10px">Question ${qIndex+1} of ${QUESTIONS.length}</div>

    <div class="section-badge" style="background:${SECTIONS[q.sec].color}">${q.sec} · ${SECTIONS[q.sec].name}</div>

    <div style="background:white;border:2px solid #dbeafe;border-radius:12px;padding:18px;margin-bottom:14px">
      <div style="font-size:12px;color:#94a3b8;margin-bottom:4px">Question ${q.id}</div>
      <div style="font-size:19px;font-weight:800;color:var(--text);margin-bottom:12px">${q.text}</div>
      ${q.display ? `<div class="q-display">${q.display}</div>` : ''}
      <div class="options ${q.opts.length===4?'four-col':q.opts.length===3?'three-col':'two-col'}">
  `;

  q.opts.forEach((opt, i) => {
    const letter = letters[i];
    const isCorrectAns = letter === teacherAnswerKey[q.id];
    const isSelected = letter === given;
    let cls = '';
    let tag = '';
    if (isCorrectAns) {
      cls = 'correct';
      tag = '<div style="font-size:12px;font-weight:700;margin-top:4px">✅ Correct</div>';
    }
    if (isSelected && !isCorrectAns) {
      cls = 'wrong';
      tag = '<div style="font-size:12px;font-weight:700;margin-top:4px">❌ Student chose this</div>';
    }
    html += `
      <div class="opt-btn ${cls}" style="cursor:default;flex-direction:column;align-items:flex-start;">
        <div style="display:flex;align-items:center;gap:12px;width:100%">
          <span class="opt-letter">${letter}</span>${opt}
        </div>
        ${tag}
      </div>
    `;
  });

  html += `</div>`;
  if (idk) {
    html += `<div style="text-align:center;margin-top:10px;font-size:13px;color:var(--text-soft)">⬜ Student skipped this question (I don't know)</div>`;
  } else if (!correct && MISCONCEPTIONS[q.id]) {
    html += `<div style="background:#fffbeb;border-left:3px solid var(--gold);border-radius:6px;padding:10px 14px;margin-top:10px;font-size:13px;color:var(--text)">
      💡 <strong>Teacher note:</strong> ${MISCONCEPTIONS[q.id]}
    </div>`;
  }
  html += `</div>`;

  document.getElementById('app').innerHTML = html;

  document.getElementById('btn-qd-back').addEventListener('click', () => renderTeacherStudentView(r));
  const prevBtn = document.getElementById('btn-qd-prev');
  const nextBtn = document.getElementById('btn-qd-next');
  if (prevBtn && qIndex > 0) prevBtn.addEventListener('click', () => renderQuestionDetail(r, qIndex-1, filter));
  if (nextBtn && qIndex < QUESTIONS.length-1) nextBtn.addEventListener('click', () => renderQuestionDetail(r, qIndex+1, filter));

  document.querySelectorAll('.btn-qd-filter').forEach(btn => {
    btn.addEventListener('click', () => {
      const f = btn.dataset.filter;
      let idx = qIndex;
      const matches = (i) => {
        const qq = QUESTIONS[i];
        const gg = r.answers ? r.answers[qq.id] : null;
        const cc = gg && gg !== 'IDK' && gg === teacherAnswerKey[qq.id];
        const ii = gg === 'IDK' || !gg;
        return f==='all' || (f==='wrong' && !cc && !ii) || (f==='skipped' && ii);
      };
      if (!matches(idx)) {
        for (let i = 0; i < QUESTIONS.length; i++) {
          if (matches(i)) { idx = i; break; }
        }
      }
      renderQuestionDetail(r, idx, f);
    });
  });
}

function renderParentReport(r) {

    <div style="font-size:14px;line-height:1.7;color:var(--text);background:var(--grey-light);border-radius:10px;padding:16px;margin-bottom:18px">
      ${r.name.split(' ')[0]} scored ${r.total} out of 38 on the Master English Baseline Assessment.

  html += `

      Prepared by Aim High Tuition. Please speak to your child's tutor about next steps.

  app.innerHTML = html;

let state = {
  phase: "cover",
  student: {},
  qIndex: 0,
  answers: {},
  selected: null,
  revealed: false,
  startTime: null,
  practiceSelected: null,
  writingText: "",
  timerInterval: null,
};

// ── LIVE TIMER (tutor-facing pacing aid, not exam-style pressure) ───────────
// Counts up plainly, but shifts colour past soft thresholds so a supervising
// tutor can notice pacing at a glance without it feeling like a countdown or
// exam clock to the student. Thresholds match the cover page's own guidance
// (~25-30 min typical, try not to exceed 35).
function startQuizTimer() {
  stopQuizTimer(); // guard against double-starting
  state.timerInterval = setInterval(updateQuizTimerDisplay, 1000);
  updateQuizTimerDisplay();
}
function stopQuizTimer() {
  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
}
function updateQuizTimerDisplay() {
  const el = document.getElementById("quiz-timer");
  const textEl = document.getElementById("quiz-timer-text");
  if (!el || !textEl || !state.startTime) return;
  const elapsedSec = Math.floor((Date.now() - state.startTime) / 1000);
  const mins = Math.floor(elapsedSec / 60);
  const secs = elapsedSec % 60;
  textEl.textContent = mins + ":" + String(secs).padStart(2, "0");
  let color = "var(--text-soft)", bg = "var(--grey-light)"; // under 25 min
  if (elapsedSec >= 35 * 60) { color = "var(--red-c)"; bg = "var(--red-light)"; }     // past 35 min
  else if (elapsedSec >= 25 * 60) { color = "var(--amber)"; bg = "var(--amber-light)"; } // past 25 min
  el.style.color = color;
  el.style.background = bg;
}

// ── READ-ALOUD (Web Speech API) ─────────────────────────────────────────────
let cachedVoicesMaster = [];
if (typeof window !== "undefined" && "speechSynthesis" in window) {
  cachedVoicesMaster = window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => {
    cachedVoicesMaster = window.speechSynthesis.getVoices();
  };
}
function pickFriendlyVoiceMaster() {
  if (!cachedVoicesMaster || !cachedVoicesMaster.length) return null;
  return cachedVoicesMaster.find(v => /en-GB/i.test(v.lang) && /female|natural/i.test(v.name))
      || cachedVoicesMaster.find(v => /en-GB/i.test(v.lang))
      || cachedVoicesMaster.find(v => /^en/i.test(v.lang))
      || null;
}
// Strips HTML/emoji, splits into sentences, speaks each with a real pause —
// avoids the rushed, robotic, run-together sound of one long utterance.
function speakText(text) {
  try {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    let plain = String(text).replace(/<[^>]*>/g, " ");
    plain = plain.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{2190}-\u{21FF}]/gu, "");
    plain = plain.replace(/\s+/g, " ").trim();
    if (!plain) return;
    const sentences = (plain.match(/[^.!?]+[.!?]?/g) || [plain]).map(s => s.trim()).filter(Boolean);
    const voice = pickFriendlyVoiceMaster();
    let i = 0;
    function speakNext() {
      if (i >= sentences.length) return;
      const utter = new SpeechSynthesisUtterance(sentences[i]);
      i++;
      utter.lang = "en-GB";
      utter.rate = 0.88;
      utter.pitch = 1.08;
      if (voice) utter.voice = voice;
      utter.onend = () => setTimeout(speakNext, 350);
      window.speechSynthesis.speak(utter);
    }
    speakNext();
  } catch(e) {}
}

}

function renderQuiz() {
  const q = QUESTIONS[state.qIndex];
  const total = QUESTIONS.length;
  const pct = Math.round(((state.qIndex) / total) * 100);
  const letters = ["A","B","C","D"];
  const secMeta = SECTIONS[q.sec];
  // Layout: 4 opts = 2x2 grid, 3 = three-col, 2 = two-col
  const layout = q.opts.length === 4 ? "four-col" : q.opts.length === 3 ? "three-col" : "two-col";

  let html = `
    <div class="progress-wrap">
      <div class="progress-bar" style="width:${pct}%"></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div class="progress-label">Question ${state.qIndex + 1} of ${total}</div>
      <div id="quiz-timer" style="display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--text-soft);background:var(--grey-light);border-radius:999px;padding:4px 12px;transition:background 0.3s,color 0.3s;">
        <span style="font-size:13px;">⏱️</span><span id="quiz-timer-text">0:00</span>
      </div>
    </div>
  `;

  // Checkpoint message
  if (q.checkpoint && !state.revealed) {
    html += `<div class="checkpoint"><span class="emoji">${q.checkpoint.slice(-2)}</span>${q.checkpoint.slice(0,-2).trim()}</div>`;
  }

  // Combine stem + plain-text display (sentence/cloze) for read-aloud, so the
  // speaker button reads the full context, not just the bare instruction.
  // Skipped for Section A (spelling/decoding is the point) and for HTML
  // displays (the shared passage already has its own dedicated speak button).
  let spokenPayload = q.text;
  if (!secMeta.noAudio && q.display && typeof q.display === "string" && !q.display.trim().startsWith("<")) {
    spokenPayload += ". " + q.display.replace(/___/g, "blank");
  }

  html += `
    <div class="section-badge" style="background:${secMeta.color}">
      ${q.sec} · ${secMeta.name}
    </div>
    <div class="q-number">Question ${q.id}</div>
    <div class="q-text" id="q-text-${q.id}">${q.text}</div>
  `;
  if (!secMeta.noAudio) {
    html += `<div id="q-speak-src-${q.id}" style="display:none">${spokenPayload}</div>`;
    html += `<button type="button" class="btn-speak" data-speak-target="q-speak-src-${q.id}">🔊 Read this question aloud</button>`;
  }

  if (q.display) {
    html += `<div class="q-display">${q.display}</div>`;
  }
  if (q.hint) {
    html += `<div class="q-hint">💡 ${q.hint}</div>`;
  }

  // Options
  html += `<div class="options ${layout}">`;
  q.opts.forEach((opt, i) => {
    const letter = letters[i];
    const cls = (letter === state.selected) ? "selected" : "";
    html += `
      <button class="opt-btn ${cls}" data-letter="${letter}">
        <span class="opt-letter">${letter}</span>
        ${opt}
      </button>
    `;
  });
  html += `</div>`;

  const isLast = state.qIndex === total - 1;
  const btnLabel = isLast ? "See my results 🎉" : "Next question →";

  // IDK button only shows before an answer is picked
  if (!state.selected) {
    html += `<button class="btn-idk" id="btn-idk">🤷 I don't know — skip this one</button>`;
  }

  html += `<button class="btn-next" id="btn-next" ${!state.selected ? "disabled" : ""}>${btnLabel}</button>`;
  html += `<div style="text-align:center;margin-top:14px">
    <button id="btn-teacher-mode-quiz" style="background:none;border:none;color:var(--text-soft);font-size:11px;cursor:pointer;text-decoration:underline;padding:4px 8px;">🔒 Teacher Mode</button>
  </div>`;
  return html;
}

    });

  // Class dropdown — same pattern as every other paper
  if (document.getElementById("f-class")) {

  }

  // Check for a resumable in-progress draft whenever the identifying fields change
  ["f-name", "f-surname", "f-year", "f-school"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener(el.tagName === "SELECT" ? "change" : "blur", checkForResumableDraft);

// ── SUBMIT TO GOOGLE SHEETS ──────────────────────────────────────────────────
function submitResults() {
  stopDraftAutoSave();
  const elapsedMs  = Date.now() - (state.startTime || Date.now());
  const mins       = Math.floor(elapsedMs / 60000);
  const secs       = Math.floor((elapsedMs % 60000) / 1000);
  const timeTaken  = `${mins}m ${secs}s`;
  const timestamp  = new Date().toISOString();

  const payload = {
    name:        state.student.name,
    year:        state.student.year,
    school:      state.student.school,
    teacher:     state.student.teacher,
    date:        state.student.date,
    status:      state.student.status,
    className:   state.student.className,
    timestamp:   timestamp,
    assessment:  "Master English",
    timeTaken:   timeTaken,
    answers:     JSON.stringify(state.answers),
    writingSample: state.writingText || "",
  };

  // Cache the submission LOCALLY *before* attempting the network request —
  // total/rag/placement aren't known yet (the server computes those), but
  // this guarantees the student's raw work is never lost even if the
  // network fails right here. syncPendingResults() below finds entries
  // like this (no total yet) and resubmits them for scoring later.
  saveResultsToStore({
    timestamp: timestamp, name: state.student.name, year: state.student.year,
    school: state.student.school, teacher: state.student.teacher, date: state.student.date,
    studentStatus: state.student.status, className: state.student.className,
    timeTaken: timeTaken, answers: state.answers, tutorComment: "",
    writingSample: state.writingText || "", aiWritingFeedback: "",
    total: null, // not yet scored — set once the server responds
  });

  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("PASTE_YOUR")) {
    const el = document.getElementById("submit-status");
    if (el) {
      el.className = "submit-status error";
      el.textContent = "⚠️ Results not sent — Apps Script URL not configured yet. Your answers are saved locally.";
    }
    return;
  }

  fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify(payload),
  })
    .then(r => r.json())
    .then(result => {
      if (result.status !== "ok") throw new Error(result.message || "Server returned an error status");
      renderResultsScreen(result, timeTaken);
      // Fill in the real score on the same cached entry, now that we have it
      updateStoredResult(timestamp, {
        total: result.total, rag: result.rag, placement: result.group,
        teacherNote: result.teacherNote, secScores: result.secScores,
      });
    })
    .catch(err => {
      console.error("Master English submission failed:", err); // visible in browser dev tools for diagnosis
      const el = document.getElementById("submit-status");
      if (el) {
        el.className = "submit-status error";
        el.innerHTML = "⚠️ Could not send results. Your answers are safely saved — please try again, or your teacher can recover it later from Teacher Mode."
          + '<br><button id="btn-retry-submit" style="margin-top:8px;background:var(--brand);border:none;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer;color:white;">Try Again</button>';
        const retryBtn = document.getElementById("btn-retry-submit");
        if (retryBtn) retryBtn.addEventListener("click", () => { state.submitted = false; render(); });
      }
    });
}

// ── CLASS DROPDOWN (self-managed, same pattern as every other paper) ────────
function loadClasses() {
  const sel = document.getElementById("f-class");
  if (!sel) return;
  const fallback = ["Other"];
  function populate(names) {
    sel.innerHTML = "";
    names.forEach(name => { const opt = document.createElement("option"); opt.value = name; opt.textContent = name; sel.appendChild(opt); });
    onClassSelectChange();
  }
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("PASTE_YOUR")) { populate(fallback); return; }
  fetch(APPS_SCRIPT_URL + "?action=getClasses")
    .then(r => r.json())
    .then(data => populate(data.classes && data.classes.length ? data.classes : fallback))
    .catch(() => populate(fallback));
}
function loadTutors() {
  populateTutorSelect();
}
function onClassSelectChange() {
  const sel = document.getElementById("f-class");
  const other = document.getElementById("f-class-other");
  if (!sel || !other) return;
  other.style.display = (sel.value === "Other") ? "block" : "none";
}
function resolveSelectedClass() {
  const sel = document.getElementById("f-class");
  if (!sel) return "";
  if (sel.value === "Other") {
    const typed = document.getElementById("f-class-other").value.trim();
    return typed || "Other";
  }
  return sel.value;
}

// ── SERVER-SIDE DRAFT AUTO-SAVE & RESUME ─────────────────────────────────────
let draftAutoSaveInterval = null;
const DRAFT_AUTOSAVE_MS = 20000;

function startDraftAutoSave() {
  if (draftAutoSaveInterval) clearInterval(draftAutoSaveInterval);
  draftAutoSaveInterval = setInterval(() => {
    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("PASTE_YOUR") || !state.student) return;
    fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({
        action: "saveDraft",
        name: state.student.name, year: state.student.year, school: state.student.school,
        teacher: state.student.teacher, status: state.student.status, className: state.student.className,
        startTimestamp: state.startTimestamp,
        answers: JSON.stringify(state.answers)
      })
    }).catch(() => {});
  }, DRAFT_AUTOSAVE_MS);
}
function stopDraftAutoSave() {
  if (draftAutoSaveInterval) { clearInterval(draftAutoSaveInterval); draftAutoSaveInterval = null; }
}

function checkForResumableDraft() {
  const name = document.getElementById("f-name").value.trim();
  const surname = document.getElementById("f-surname").value.trim();
  const fullName = name + (surname ? " " + surname : "");
  const year = document.getElementById("f-year").value;
  const school = document.getElementById("f-school").value.trim();
  if (!name || !year || !school || !APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("PASTE_YOUR")) return;
  fetch(APPS_SCRIPT_URL + "?action=getDraft&name=" + encodeURIComponent(fullName) + "&year=" + encodeURIComponent(year) + "&school=" + encodeURIComponent(school))
    .then(r => r.json())
    .then(draft => {
      const banner = document.getElementById("server-resume-banner");
      if (!banner) return;
      if (draft && draft.name) {
        banner.style.display = "block";
        banner.innerHTML = `An in-progress attempt was found (${draft.answeredCount || 0} questions answered, last saved ${new Date(draft.lastSaved).toLocaleString()}).
          <button id="btn-resume-server-draft" type="button" style="margin-left:8px;">Resume</button>
          <button id="btn-fresh-start-server" type="button" style="margin-left:4px;">Start Fresh</button>`;
        document.getElementById("btn-resume-server-draft").addEventListener("click", () => resumeServerDraft(fullName, year, school, draft));
        document.getElementById("btn-fresh-start-server").addEventListener("click", () => { banner.style.display = "none"; });
      } else {
        banner.style.display = "none";
      }
    }).catch(() => {});
}

function resumeServerDraft(fullName, year, school, draft) {
  state.student = {
    name: fullName, year, school, teacher: draft.teacher,
    date: new Date().toISOString().slice(0,10),
    academicYear: getAcademicYear(new Date().toISOString().slice(0,10)), term: getTerm(new Date()),
    status: draft.status, className: draft.className
  };
  state.startTime = Date.now() - (Date.now() - new Date(draft.startTimestamp).getTime());
  state.startTimestamp = draft.startTimestamp;
  try { state.answers = JSON.parse(draft.answers || "{}"); } catch(e) { state.answers = {}; }
  state.qIndex = Object.keys(state.answers).length;
  state.phase = "quiz";
  render();
  startQuizTimer();
  startDraftAutoSave();
}

// ── DEEP LINK from the submission email ──────────────────────────────────────
function getDeepLinkParams() {
  const params = new URLSearchParams(window.location.search);
  if (params.get("view") !== "student") return null;
  return {
    name: params.get("name") || "", year: params.get("year") || "",
    school: params.get("school") || "", teacher: params.get("teacher") || "",
    timestamp: params.get("timestamp") || ""
  };
}
const pendingDeepLink = getDeepLinkParams();

// ── LIVE MONITOR — see who's currently mid-test, polling every 12s ─────────
let liveMonitorInterval = null;
const LIVE_MONITOR_POLL_MS = 12000;

function renderLiveMonitor() {
  const app = document.getElementById("app");
  app.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <div style="font-size:20px;font-weight:900;color:var(--brand-dark);flex:1">📡 Live Monitor</div>
      <button id="btn-lm-back" style="background:none;border:2px solid var(--grey-mid);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text-soft);">✕ Close</button>
    </div>
    <div id="lm-content"><p style="color:var(--text-soft)">Loading...</p></div>
  `;
  document.getElementById("btn-lm-back").addEventListener("click", () => {
    if (liveMonitorInterval) { clearInterval(liveMonitorInterval); liveMonitorInterval = null; }
    renderTeacherDashboard();
  });
  pollLiveMonitor();
  if (liveMonitorInterval) clearInterval(liveMonitorInterval);
  liveMonitorInterval = setInterval(pollLiveMonitor, LIVE_MONITOR_POLL_MS);
}

function pollLiveMonitor() {
  const el = document.getElementById("lm-content");
  if (!el) return;
  fetch(APPS_SCRIPT_URL + "?action=getActiveDrafts&pin=" + encodeURIComponent(TEACHER_PIN))
    .then(r => r.json())
    .then(drafts => {
      const el2 = document.getElementById("lm-content");
      if (!el2) return;
      if (drafts.error) { el2.innerHTML = `<p style="color:var(--red-c)">${drafts.error}</p>`; return; }
      if (!drafts.length) { el2.innerHTML = `<p style="color:var(--text-soft)">No students currently mid-test.</p>`; return; }
      el2.innerHTML = drafts.map(d => `
        <div style="background:white;border:2px solid var(--grey-mid);border-radius:10px;padding:12px 14px;margin-bottom:8px">
          <div style="font-weight:700;color:var(--brand-dark)">${d.name} <span style="font-weight:400;color:var(--text-soft);font-size:12px">(${d.year || ""}${d.className ? " — " + d.className : ""})</span></div>
          <div style="font-size:12px;color:var(--text-soft);margin-top:2px">
            Started ${new Date(d.startTimestamp).toLocaleTimeString()} · ${d.answeredCount || 0}/38 answered · last saved ${Math.round((Date.now() - new Date(d.lastSaved).getTime())/1000)}s ago
          </div>
        </div>
      `).join("");
    })
    .catch(() => {
      const el3 = document.getElementById("lm-content");
      if (el3) el3.innerHTML = `<p style="color:var(--red-c)">Could not load. Check your connection.</p>`;
    });
}

// ── QUESTION WALKTHROUGH — go through the blank paper, reveal answers on demand ──
let walkthroughRevealed = {};

function renderWalkthrough(idx) {
  const app = document.getElementById("app");
  if (!teacherAnswerKey || Object.keys(teacherAnswerKey).length === 0) {
    app.innerHTML = `<p style="color:var(--text-soft)">Loading answer key...</p>`;
    loadTeacherAnswerKey().then(() => renderWalkthrough(idx));
    return;
  }

  const q = QUESTIONS[idx];
  const letters = ["A", "B", "C", "D"];
  const revealed = !!walkthroughRevealed[q.id];
  const correctLetter = teacherAnswerKey[q.id];

  const optsHtml = q.opts.map((opt, i) => {
    const letter = letters[i];
    const isCorrect = revealed && letter === correctLetter;
    return `<div style="padding:10px 14px;border:2px solid ${isCorrect ? "var(--green)" : "var(--grey-mid)"};border-radius:8px;margin-bottom:6px;background:${isCorrect ? "var(--green-light)" : "white"};font-weight:${isCorrect ? "700" : "400"}">${opt}</div>`;
  }).join("");

  app.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <div style="font-size:20px;font-weight:900;color:var(--brand-dark);flex:1">📖 Walkthrough — Q${idx + 1} of ${QUESTIONS.length}</div>
      <button id="btn-wt-back" style="background:none;border:2px solid var(--grey-mid);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text-soft);">✕ Close</button>
    </div>
    <div style="background:white;border:2px solid var(--grey-mid);border-radius:12px;padding:18px">
      <div style="font-size:16px;margin-bottom:14px">${q.text}${q.display && typeof q.display === "string" ? "<div class='q-display' style='margin-top:10px'>" + q.display + "</div>" : ""}</div>
      ${optsHtml}
      ${revealed ? "" : `<button id="btn-wt-reveal" style="margin-top:10px;background:var(--brand);color:white;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;">Reveal Answer</button>`}
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:16px">
      <button id="btn-wt-prev" ${idx === 0 ? "disabled" : ""} style="background:none;border:2px solid var(--grey-mid);border-radius:8px;padding:8px 16px;font-weight:600;cursor:pointer;">← Previous</button>
      <button id="btn-wt-next" ${idx === QUESTIONS.length - 1 ? "disabled" : ""} style="background:none;border:2px solid var(--grey-mid);border-radius:8px;padding:8px 16px;font-weight:600;cursor:pointer;">Next →</button>
    </div>
  `;

  document.getElementById("btn-wt-back").addEventListener("click", () => renderTeacherDashboard());
  document.getElementById("btn-wt-prev").addEventListener("click", () => { if (idx > 0) renderWalkthrough(idx - 1); });
  document.getElementById("btn-wt-next").addEventListener("click", () => { if (idx < QUESTIONS.length - 1) renderWalkthrough(idx + 1); });
  const revealBtn = document.getElementById("btn-wt-reveal");
  if (revealBtn) revealBtn.addEventListener("click", () => { walkthroughRevealed[q.id] = true; renderWalkthrough(idx); });
}

// ── INIT ─────────────────────────────────────────────────────────────────────
render();
if (pendingDeepLink) {
  const btnTeacherMode = document.getElementById("btn-teacher-mode");
  if (btnTeacherMode) btnTeacherMode.click();
}
</script>
